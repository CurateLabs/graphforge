name: M21 Contract Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust contract rows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Execute Rust matrix group
        run: python3 scripts/ci/m21-contract-gate.py run-group --group rust --output gate-fragments
      - name: Save Rust evidence for report job
        if: always()
        uses: actions/cache/save@v6
        with:
          path: gate-fragments/
          key: m21-transfer-${{ github.run_id }}-rust

  python:
    name: Python contract rows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Execute Python matrix group
        run: python3 scripts/ci/m21-contract-gate.py run-group --group python --output gate-fragments
      - name: Save Python evidence for report job
        if: always()
        uses: actions/cache/save@v6
        with:
          path: gate-fragments/
          key: m21-transfer-${{ github.run_id }}-python

  node:
    name: Node contract rows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Execute Node matrix group
        run: python3 scripts/ci/m21-contract-gate.py run-group --group node --output gate-fragments
      - name: Save Node evidence for report job
        if: always()
        uses: actions/cache/save@v6
        with:
          path: gate-fragments/
          key: m21-transfer-${{ github.run_id }}-node

  report:
    name: SHA-bound closure report
    if: always()
    needs: [rust, python, node]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v6
        with:
          path: gate-fragments
          key: m21-transfer-${{ github.run_id }}-rust
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: gate-fragments
          key: m21-transfer-${{ github.run_id }}-python
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: gate-fragments
          key: m21-transfer-${{ github.run_id }}-node
          fail-on-cache-miss: true
      - name: Build exact closure report
        run: >-
          python3 scripts/ci/m21-contract-gate.py report
          --sha "${{ github.sha }}"
          --fragments gate-fragments
          --output gate-report
