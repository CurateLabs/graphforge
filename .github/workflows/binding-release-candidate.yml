name: Binding Release Candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binding-rc-${{ inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  validate_source:
    name: Validate post-merge main SHA
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      evidence_sha: ${{ steps.source.outputs.evidence_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Require current main commit
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$REQUESTED_SHA" = "$main_sha"
          printf 'evidence_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

  python:
    name: Python RC (${{ matrix.target }})
    needs: validate_source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, target: python-ubuntu }
          - { os: blacksmith-6vcpu-macos-15, target: python-macos }
          - { os: blacksmith-4vcpu-windows-2025, target: python-windows }
    env:
      CARGO_INCREMENTAL: 0
      EVIDENCE_SHA: ${{ needs.validate_source.outputs.evidence_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate_source.outputs.evidence_sha }}

      - name: Verify immutable checkout
        shell: bash
        run: |
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Build native abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/graphforge-bindings-py/Cargo.toml --out dist
          manylinux: auto
          sccache: "false"

      # The maturin action owns its build wrapper. Later Python contracts may
      # launch Cargo after that wrapper has left PATH, especially on containerized
      # Linux runners, so validate the inherited command before those contracts.
      - name: Prepare Rust compiler wrapper for native contracts
        shell: bash
        run: |
          python3 scripts/ci/prepare-rustc-wrapper.py \
            --platform "${{ matrix.target }}" \
            --contract python-native-contracts

      - name: Prepare writable Cargo target for native contracts
        shell: bash
        run: |
          cargo_target_dir="$RUNNER_TEMP/graphforge-python-native-target"
          if ! mkdir -p "$cargo_target_dir" || \
             ! touch "$cargo_target_dir/.graphforge-write-probe" || \
             ! rm "$cargo_target_dir/.graphforge-write-probe"; then
            printf 'cargo_target_state=unwritable target=runner-temp/graphforge-python-native-target\n' >&2
            exit 1
          fi
          printf 'CARGO_TARGET_DIR=%s\n' "$cargo_target_dir" >> "$GITHUB_ENV"
          printf 'cargo_target_state=ready target=runner-temp/graphforge-python-native-target\n'

      - name: Prepare writable Python RC evidence directory
        shell: bash
        env:
          PYTHON_RC_EVIDENCE_DIR: ${{ runner.temp }}/graphforge-python-rc-evidence
        run: |
          if ! mkdir -p "$PYTHON_RC_EVIDENCE_DIR" || \
             ! touch "$PYTHON_RC_EVIDENCE_DIR/.graphforge-write-probe" || \
             ! rm "$PYTHON_RC_EVIDENCE_DIR/.graphforge-write-probe"; then
            printf 'python_rc_evidence_state=unwritable target=runner-temp/graphforge-python-rc-evidence\n' >&2
            exit 1
          fi
          printf 'python_rc_evidence_state=ready target=runner-temp/graphforge-python-rc-evidence\n'

      - name: Clean-install and execute native contract
        shell: bash
        env:
          PYTHON_RC_EVIDENCE_DIR: ${{ runner.temp }}/graphforge-python-rc-evidence
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f crates/graphforge-bindings-py/tests/gil_release.py
          for test_file in crates/graphforge-bindings-py/tests/*.py; do
            uv run --isolated --no-project --with "${wheels[0]}" python "$test_file"
          done
          GRAPHFORGE_PYTHON_PARITY_REPORT="$PYTHON_RC_EVIDENCE_DIR/python-classification.json" \
            uv run --isolated --no-project --with "${wheels[0]}" \
            python crates/graphforge-bindings-py/tests/non_cypher_release.py \
            --classification-only

      - name: Write target evidence
        shell: bash
        env:
          PYTHON_RC_EVIDENCE_DIR: ${{ runner.temp }}/graphforge-python-rc-evidence
        run: |
          wheels=(dist/*.whl)
          python3 scripts/ci/write-binding-parity-evidence.py \
            --language python \
            --source-sha "$EVIDENCE_SHA" \
            --target "${{ matrix.target }}" \
            --execution-mode native \
            --artifact "${wheels[0]}" \
            --classification "$PYTHON_RC_EVIDENCE_DIR/python-classification.json" \
            --package-manifest crates/graphforge-bindings-py/pyproject.toml \
            --case "clean-installed native Python contract" \
            --case "structured errors and Arrow results" \
            --case "no fallback execution" \
            --case "GIL acceptance" \
            --output "$PYTHON_RC_EVIDENCE_DIR/${{ matrix.target }}.json"

      - name: Stage Python report for aggregate job
        shell: bash
        env:
          PYTHON_RC_EVIDENCE_DIR: ${{ runner.temp }}/graphforge-python-rc-evidence
        run: |
          mkdir -p binding-rc-reports
          cp "$PYTHON_RC_EVIDENCE_DIR/${{ matrix.target }}.json" binding-rc-reports/

      - name: Save Python report for aggregate job
        uses: actions/upload-artifact@v7
        with:
          name: binding-rc-report-${{ github.run_id }}-${{ matrix.target }}
          path: binding-rc-reports/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Save tested wheel for release-candidate assembly
        uses: actions/upload-artifact@v7
        with:
          name: binding-rc-wheel-${{ github.run_id }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  node:
    name: Node RC (${{ matrix.target }})
    needs: validate_source
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
            report_target: node-x86_64-apple-darwin
            execution_mode: native
            cross_args: ""
            node_arch: x64
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            report_target: node-aarch64-apple-darwin
            execution_mode: native
            cross_args: ""
            node_arch: arm64
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            report_target: node-x86_64-unknown-linux-gnu
            execution_mode: native
            cross_args: ""
            node_arch: x64
          - os: blacksmith-4vcpu-ubuntu-2404
            target: aarch64-unknown-linux-gnu
            report_target: node-aarch64-unknown-linux-gnu
            execution_mode: package-validation
            cross_args: --use-napi-cross
            arm_cflags: -D__ARM_ARCH=8
            node_arch: x64
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            report_target: node-x86_64-pc-windows-msvc
            execution_mode: native
            cross_args: ""
            node_arch: x64
            timeout_minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      EVIDENCE_SHA: ${{ needs.validate_source.outputs.evidence_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate_source.outputs.evidence_sha }}

      - name: Verify immutable checkout
        shell: bash
        run: |
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          architecture: ${{ matrix.node_arch }}

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Install workspace dependencies
        run: pnpm install

      - name: Verify executable Node architecture
        shell: bash
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_NODE_ARCH"

      - name: Reject stale native output
        shell: bash
        run: |
          if compgen -G 'crates/graphforge-bindings-node/*.node' > /dev/null; then
            echo "unexpected addon existed before the matrix build" >&2
            exit 1
          fi

      - name: Build declared publish target
        shell: bash
        env:
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.arm_cflags || '' }}
        run: >-
          pnpm --filter @graphforge/node exec napi build --platform --release
          --target ${{ matrix.target }} ${{ matrix.cross_args }}

      - name: Execute native parity and smoke contract
        if: matrix.execution_mode == 'native'
        shell: bash
        run: |
          addons=(crates/graphforge-bindings-node/*.node)
          test "${#addons[@]}" -eq 1
          ADDON_PATH="${addons[0]}" node - <<'JS' > built-addon.sha256
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          process.stdout.write(crypto.createHash("sha256")
            .update(fs.readFileSync(process.env.ADDON_PATH)).digest("hex") + "\n");
          JS
          node -e 'import("./crates/graphforge-bindings-node/index.js").then(m => {
            if (typeof m.version() !== "string") process.exit(1)
          })'
          pnpm --filter @graphforge/node test:smoke
          pnpm --filter @graphforge/node exec node --test \
            tests/non-cypher-release-parity.test.mjs \
            tests/async-errors.test.mjs
          ADDON_PATH="${addons[0]}" node - <<'JS' > tested-addon.sha256
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          process.stdout.write(crypto.createHash("sha256")
            .update(fs.readFileSync(process.env.ADDON_PATH)).digest("hex") + "\n");
          JS
          cmp built-addon.sha256 tested-addon.sha256

      - name: Validate cross-built package
        if: matrix.execution_mode == 'package-validation'
        shell: bash
        working-directory: crates/graphforge-bindings-node
        env:
          NODE_TARGET: ${{ matrix.target }}
        run: |
          addons=(*.node)
          test "${#addons[@]}" -eq 1
          mkdir -p artifacts
          cp "${addons[0]}" artifacts/
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts --npm-dir npm
          python3 "$GITHUB_WORKSPACE/scripts/ci/validate-napi-artifacts.py" \
            --npm-dir npm --manifest package.json --target "$NODE_TARGET"

      - name: Write target evidence
        shell: bash
        run: |
          addons=(crates/graphforge-bindings-node/*.node)
          rationale=()
          if test "${{ matrix.execution_mode }}" = package-validation; then
            rationale=(--execution-rationale \
              "target cannot execute on the incompatible GitHub-hosted runner architecture")
          fi
          python3 scripts/ci/write-binding-parity-evidence.py \
            --language node \
            --source-sha "$EVIDENCE_SHA" \
            --target "${{ matrix.report_target }}" \
            --execution-mode "${{ matrix.execution_mode }}" \
            "${rationale[@]}" \
            --artifact "${addons[0]}" \
            --classification crates/graphforge-bindings-node/tests/non-cypher-parity-policy.json \
            --package-manifest crates/graphforge-bindings-node/package.json \
            --case "${{ matrix.execution_mode }} binding contract" \
            --output "crates/graphforge-bindings-node/${{ matrix.report_target }}.json"

      - name: Stage Node report for aggregate job
        shell: bash
        run: |
          mkdir -p binding-rc-reports
          cp "crates/graphforge-bindings-node/${{ matrix.report_target }}.json" binding-rc-reports/

      - name: Save Node report for aggregate job
        uses: actions/upload-artifact@v7
        with:
          name: binding-rc-report-${{ github.run_id }}-${{ matrix.report_target }}
          path: binding-rc-reports/${{ matrix.report_target }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Save tested addon for release-candidate assembly
        uses: actions/upload-artifact@v7
        with:
          name: binding-rc-addon-${{ github.run_id }}-${{ matrix.target }}
          path: crates/graphforge-bindings-node/*.node
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Aggregate binding RC evidence
    if: always() && needs.validate_source.result == 'success'
    needs: [validate_source, python, node]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate_source.outputs.evidence_sha }}

      - name: Download exact-run target reports
        uses: actions/download-artifact@v8
        with:
          pattern: binding-rc-report-${{ github.run_id }}-*
          path: binding-rc-reports
          merge-multiple: true

      - name: Validate and aggregate
        run: >-
          python3 scripts/ci/validate-binding-release-candidate.py
          --reports binding-rc-reports
          --contract tests/contracts/binding-release-candidate-targets.json
          --expected-sha "${{ needs.validate_source.outputs.evidence_sha }}"
          --output binding-rc-aggregate/report.json

      - name: Save fail-closed aggregate for M1 certification
        uses: actions/cache/save@v6
        with:
          path: binding-rc-aggregate/report.json
          key: binding-release-candidate-${{ needs.validate_source.outputs.evidence_sha }}

      - name: Retain aggregate publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: M1-Binding-Release-Candidate-${{ needs.validate_source.outputs.evidence_sha }}
          path: binding-rc-aggregate/report.json
          if-no-files-found: error
          retention-days: 30

  release_candidate:
    name: Assemble immutable M1 release candidate
    needs: [validate_source, aggregate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      EVIDENCE_SHA: ${{ needs.validate_source.outputs.evidence_sha }}
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-candidate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate_source.outputs.evidence_sha }}

      - name: Verify immutable checkout
        shell: bash
        run: |
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Download exact-run tested wheels
        uses: actions/download-artifact@v8
        with:
          pattern: binding-rc-wheel-${{ github.run_id }}-*
          path: candidate/release-artifacts/python
          merge-multiple: true

      - name: Download exact-run tested Node addons
        uses: actions/download-artifact@v8
        with:
          pattern: binding-rc-addon-${{ github.run_id }}-*
          path: candidate/release-artifacts/node-addons
          merge-multiple: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Record publication dry-runs
        run: >-
          python3 scripts/publish_dry_run.py
          --surface npm,docs,python,cargo-package
          --report candidate/release-artifacts/evidence/publication-dry-run.json

      - name: Build Python source distribution
        run: >-
          uv run maturin sdist
          --manifest-path crates/graphforge-bindings-py/Cargo.toml
          --out candidate/release-artifacts/python

      - name: Assemble and pack every npm package
        shell: bash
        run: |
          mkdir -p candidate/release-artifacts/npm
          mkdir -p crates/graphforge-bindings-node/artifacts
          cp candidate/release-artifacts/node-addons/*.node \
            crates/graphforge-bindings-node/artifacts/
          pushd crates/graphforge-bindings-node
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts --npm-dir npm
          python3 ../../../scripts/ci/validate-napi-artifacts.py \
            --npm-dir npm --manifest package.json
          pnpm exec napi pre-publish -t npm --skip-optional-publish
          for package_dir in npm/*; do
            npm pack "$package_dir" --ignore-scripts \
              --pack-destination "$GITHUB_WORKSPACE/candidate/release-artifacts/npm"
          done
          npm pack . --ignore-scripts \
            --pack-destination "$GITHUB_WORKSPACE/candidate/release-artifacts/npm"
          popd
          npm pack packages/cli --ignore-scripts \
            --pack-destination candidate/release-artifacts/npm
          npm pack packages/agent-skills --ignore-scripts \
            --pack-destination candidate/release-artifacts/npm

      - name: Package the complete Rust surface
        shell: bash
        run: |
          mkdir -p candidate/release-artifacts/crates
          python3 scripts/ci/crate-publish-plan.py check
          while IFS= read -r crate; do
            cargo package -p "$crate" --allow-dirty --no-verify
            cp "target/release-candidate/package/${crate}-0.5.0.crate" \
              candidate/release-artifacts/crates/
          done < <(python3 scripts/ci/crate-publish-plan.py list)

      - name: Record license and package evidence
        run: |
          python3 scripts/license_check.py \
            --report candidate/release-artifacts/evidence/license-compliance-report.json
          python3 scripts/verify_package_licenses.py \
            --report candidate/release-artifacts/evidence/package-license-report.json

      - name: Create and validate the immutable checksum record
        run: |
          python3 scripts/record_release_artifacts.py \
            --version 0.5.0 \
            --dist-dir candidate/release-artifacts \
            --out candidate/v0.5.0-artifacts.json \
            --notes "M1 Binding Release Candidate run $GITHUB_RUN_ID; exact SHA $EVIDENCE_SHA"
          python3 scripts/ci/clean-env-verify.py validate-release-record \
            candidate/v0.5.0-artifacts.json
          python3 scripts/ci/release-candidate.py validate \
            --record candidate/v0.5.0-artifacts.json \
            --artifacts-dir candidate/release-artifacts \
            --expected-sha "$EVIDENCE_SHA" \
            --version 0.5.0

      - name: Retain the release candidate for publication
        uses: actions/upload-artifact@v7
        with:
          name: M1-Release-Candidate-${{ needs.validate_source.outputs.evidence_sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
