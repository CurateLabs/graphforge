name: Fly Tiny Recovery (operator handoff)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    name: Render Python + Pulumi ESC recovery command
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate registry
        run: python3 scripts/ci/gate-registry.py validate
      - name: Render operator handoff
        run: |
          python3 scripts/ci/gate-registry.py command fly-tiny-recovery
          echo "No provider operation occurs in GitHub Actions; execute through Pulumi ESC."
