name: Test Suite

# The whole PR gate: lint, the Rust suite, the bindings built from the same
# tree, and the Windows storage tests. There is no macOS lane (#1760): a macOS
# runner minute costs forty Linux minutes. The `target_os = "macos"` admission
# code in graphforge-storage runs in CI only where publish.yaml's macOS wheel
# lane opens a durable project, on a release tag or a release-path PR. `CI Gate` is the one required
# status. The merge queue runs this same workflow on the tree that will land.
on:
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Classify Changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      platform: ${{ steps.filter.outputs.platform }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
      agent_skills: ${{ steps.filter.outputs.agent_skills }}
      pulumi: ${{ steps.filter.outputs.pulumi }}
      terraform: ${{ steps.filter.outputs.terraform }}
      licenses: ${{ steps.filter.outputs.licenses }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Prose-only changes skip the build lanes; a workflow change runs every
      # lane. Everything else is a plain path match. Prose means documentation
      # pages and top-level Markdown: Markdown under crates/, project-skills/,
      # packages/, or tests/ ships in a package or is read by a test.
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only --no-renames "$BASE...HEAD")"
          changed() { grep -Eq "$1" <<<"$files"; }
          all=false
          if changed '^\.github/workflows/test\.yml$'; then all=true; fi
          emit() {
            local value=false
            if [[ "$all" == true ]] || changed "$2"; then value=true; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
          }
          code=false
          prose='^(docs/.*\.mdx?|[^/]+\.md|\.github/[^/]+\.md|\.github/ISSUE_TEMPLATE/.*|docs-site/.*)$'
          if [[ "$all" == true ]] || grep -Evq "$prose" <<<"$files"; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          emit platform '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
          emit benchmarks '^(benchmarks/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
          emit agent_skills '^(packages/agent-skills/|project-skills/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          emit pulumi '^(iac/pulumi/|docs/contracts/|crates/graphforge-cli/src/lib\.rs$|crates/graphforge-api/src/repository\.rs$)'
          emit terraform '^(iac/terraform/|docs/contracts/|crates/graphforge-cli/src/lib\.rs$|crates/graphforge-api/src/repository\.rs$)'
          emit licenses '^(Cargo\.lock|deny\.toml|about\.toml|scripts/generate_third_party_notices\.py|THIRD_PARTY_NOTICES\.md)$'

  # Always runs: the repository checks guard the docs tree and the ADR
  # indexes, which only prose changes can break.
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: uv sync --locked --all-extras

      # The same target a contributor runs before pushing.
      - name: make check
        if: needs.changes.outputs.code == 'true'
        run: make check

      - name: Repository checks (prose-only change)
        if: needs.changes.outputs.code != 'true'
        run: scripts/ci/repo-checks.sh

      - name: Install pnpm for the script self-tests
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node for the script self-tests
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Several suites read crate sources, so they follow every code change.
      - name: Script self-tests
        if: needs.changes.outputs.code == 'true'
        run: |
          pnpm install --frozen-lockfile --filter @curatelabs/graphforge...
          make test-scripts

      - name: Install cargo-deny and cargo-about
        if: needs.changes.outputs.licenses == 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.1
      - name: Check third-party Rust licenses and notices
        if: needs.changes.outputs.licenses == 'true'
        run: |
          cargo deny check licenses
          cargo fetch --locked
          python3 scripts/generate_third_party_notices.py --check

  rust-tests:
    # The Rust test lane (ADR 0048): the whole Cargo workspace under nextest.
    # Dev/test profiles keep debug assertions and overflow checks on; do not
    # switch this lane to a release profile.
    name: Rust Tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare native test temporary storage
        run: python3 scripts/test_environment.py --github-env "$GITHUB_ENV"

      # Shared warm target/ volume. Cargo fingerprints every unit, so a stale
      # artifact is rebuilt rather than trusted; the key moves with the
      # toolchain so a compiler bump starts from an empty volume.
      - name: Mount sticky target/ disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-rust-tests-rust-1.96.0-target-v2
          path: target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.145

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      # The custom-harness targets (cucumber BDD, allocation probe) cannot
      # answer nextest's --list protocol; they run in the next job.
      - name: Rust workspace tests (nextest)
        run: make test-rust

  # Everything the nextest lane cannot run: the custom-harness targets, the
  # doctests, and the test targets gated behind non-default features. It runs
  # beside Rust Tests rather than lengthening it.
  rust-extras:
    name: Rust Harness, Doc, and Feature Tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare native test temporary storage
        run: python3 scripts/test_environment.py --github-env "$GITHUB_ENV"
      - name: Mount sticky target/ disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-rust-extras-rust-1.96.0-target-v1
          path: target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.145
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      # The custom-harness targets cannot answer nextest's --list protocol,
      # so they run under cargo test.
      - name: Rust custom-harness tests (bdd, disabled_allocations)
        run: >-
          python3 scripts/test_environment.py --
          cargo test --workspace --locked --test bdd --test disabled_allocations

      - name: Rust doctests
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/test_environment.py --
          cargo test --workspace --locked --doc

      # Test targets whose required features sit outside their package's
      # default set are skipped by the workspace run; each runs here with its
      # features.
      - name: Rust feature-gated tests (differential traversal oracle)
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/test_environment.py --
          cargo nextest run --locked --no-fail-fast
          -p graphforge-exec --features differential-testing --test differential_traversal

  # The lean feature sets are shipped configurations (no default features);
  # they compile different code, so they build and test on their own.
  feature-boundary:
    name: API and Executor Feature Boundary
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare native test temporary storage
        run: python3 scripts/test_environment.py --github-env "$GITHUB_ENV"
      - name: Mount sticky target/ disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-feature-boundary-rust-1.96.0-target-v1
          path: target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
      - name: Build and test the lean API and core executor
        run: |
          cargo test --locked -p graphforge-api --no-default-features
          cargo test --locked -p graphforge-exec --no-default-features --features algorithms-core

  # #[cfg(windows)] lock and handle behavior in graphforge-storage does not run
  # on the Linux lane; durable-project tests need ext4/xfs/btrfs and do not run
  # here. The lists name the platform-sensitive tests.
  windows-storage:
    name: Windows Storage
    runs-on: blacksmith-4vcpu-windows-2025
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Filesystem primitives
        run: cargo test -p graphforge-filesystem --lib --no-fail-fast

      - name: Storage locks, handles, mapped routes, and portable lifecycle
        run: >-
          cargo test -p graphforge-storage --lib --no-fail-fast --
          project_generation::tests::
          filesystem_admission::tests::
          durable_commit::windows_allocation_tests::windows_immutable_link_refreshes_native_allocation_and_preserves_reused_temporary
          adjacency::installation::tests::csr_shard_publication_supports_long_windows_paths
          project_portable_v2_export::tests::destination_replacement_and_source_mutation_fail_closed
          project_portable_v2_export::tests::canonical_source_path_
          project_portable_v2_import::tests::authenticated_cleanup_releases_handles_before_removal
          graph_object_store::installation::repair_tests::
          graph_object_store::tests::pure_reads_require_only_existing_digest_namespace_and_never_create
          graph_object_store::tests::read_only_guard_pins_cas_against_gc
          graph_object_store::tests::read_only_lifecycle_rejects_multiple_links
          graph_object_store::tests::returned_errors_release_every_cas_lock_and_pending_lease_boundary
          graph_object_store::tests::publication_and_gc_lifecycles_are_mutually_exclusive
          graph_object_store::materialization::tests::materialization_gives_mutable_uuid_controls_private_single_link_inodes
          runtime_entity_labels::tests::catalog_persistence_replaces_read_only_cas_aliases
          route_component::tests::
          route_component::owned::tests::legacy_cas_materialization_translates_routes_before_creating_paths
          uuid_membership::tests::owned_manifest_
          uuid_membership::tests::readonly_shared_runs_preserve_uuid_snapshot_authentication
          graph_files::tests::graph_file_copy_
          adjacency::builder::tests::admitted_reserved_relations_build_portable_distinct_indexes
          mutator::tests::mapped_reserved_delete_preserves_other_routes_and_reopens
          project_publication::tests::commit_lock_guard_unlocks_before_a_cloned_descriptor_closes
          project_publication::tests::optimistic_promotion_closes_staged_handles_before_directory_rename
          project_checkpoints::tests::checkpoint_read_guard_unlocks_before_a_cloned_descriptor_closes
          workspace_research_metadata::tests::summary_reads_the_project_root_identity

      - name: Publication kill matrix, injected errors, and durability certification
        run: >-
          cargo test -p graphforge-storage --features test-failpoints --lib --no-fail-fast --
          project_recovery::tests::subprocess_kill_matrix_never_exposes_a_partial_generation
          project_recovery::tests::injected_operation_errors_report_exact_commit_state
          project_portable_v2_import::tests::crash_
          project_certification

      # Clone downloads, resumes, and imports into a staged target that one
      # no-replace rename installs; Windows refuses that rename while any
      # handle in the imported project stays open.
      - name: Hub clone and portable import
        run: >-
          cargo test -p graphforge-cli --lib --no-fail-fast --
          hub_clone::

      # #1363: an open facade retains a directory handle on
      # generations/<uuid>/graph plus its generation leases. Windows is the
      # only platform that reports the retention, by refusing to remove the
      # directory.
      - name: API mapped routes and released project handles
        run: >-
          cargo test -p graphforge-api --lib --no-fail-fast --
          mapped_portable_tests::
          mapped_stream_tests::
          maintenance::tests::in_memory_compaction_cleanup_uses_ephemeral_lifecycle_mode
          workspace_hydration::tests::releasing_the_facade_releases_every_committed_generation_handle
          workspace_hydration::tests::retained_generation_handles_outlive_reads_and_survive_reopen

  # One wheel and one addon built from this tree, then every binding suite
  # against them. Python and Node are thin bindings, so a binding failure is a
  # binding bug or a Rust bug the Rust lane missed; either blocks the merge.
  bindings:
    name: Python and Node Bindings
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare native test temporary storage
        run: python3 scripts/test_environment.py --github-env "$GITHUB_ENV"
      - name: Mount sticky target/ disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-bindings-rust-1.96.0-target-v1
          path: target

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --all-extras

      # Pull requests need behaviorally correct native artifacts, not release
      # code generation. Cross-platform release builds remain in publish.yaml.
      - name: Build the wheel and the addon
        run: |
          rm -rf dist
          uvx maturin build \
            --manifest-path crates/graphforge-bindings-py/Cargo.toml \
            --profile dev \
            --out dist
          pnpm --filter @curatelabs/graphforge exec napi build --platform
          uv pip install dist/*.whl

      - name: Prove the wheel installs and runs without the repository
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uvx --from "${wheels[0]}" graphforge --version
          GRAPHFORGE_UVX_WHEEL="${wheels[0]}" \
            python3 crates/graphforge-bindings-py/tests/cli_lifecycle.py
          uv venv /tmp/gf-native --python 3.13
          uv pip install --python /tmp/gf-native/bin/python "${wheels[0]}"
          /tmp/gf-native/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("networkx") is None
          assert importlib.util.find_spec("igraph") is None
          PY
          timeout 60s /tmp/gf-native/bin/python crates/graphforge-bindings-py/tests/smoke.py
          # The documented visualization example's GraphForge path, offline (#1675).
          timeout 60s /tmp/gf-native/bin/python \
            crates/graphforge-bindings-py/tests/visualization_example_projection.py

      - name: Python binding suites
        run: make test-python

      - name: Python downstream consumers and the agent-grounding notebook
        env:
          GRAPHFORGE_WHEEL_SHA: ${{ github.sha }}
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python scripts/ci/run-native-consumers.py
          uv run --isolated --no-project \
            --with dist/*.whl \
            --with nbclient==0.11.0 \
            --with ipykernel==7.3.0 \
            python scripts/ci/run-native-notebook.py

      - name: Node binding and CLI suites
        run: make test-node

      # The same scenario through Rust, the CLI, Python, and Node must produce
      # the same report.
      - name: Compare multi-ontology semantics across all public surfaces
        run: |
          report_root="${{ runner.temp }}/multi-ontology-parity"
          mkdir -p "$report_root"
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/rust.json" \
            cargo test -q -p graphforge-api --lib \
              writes_canonical_rust_semantic_parity_report_when_requested
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/cli.json" \
            cargo test -q -p graphforge-cli --test multi_ontology \
              emit_authenticated_parity_report
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/python.json" \
            uv run --no-sync python crates/graphforge-bindings-py/tests/multi_ontology.py
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/node.json" \
            node --test crates/graphforge-bindings-node/tests/multi-ontology.test.mjs
          python3 scripts/ci/compare-multi-ontology-parity.py \
            --rust "$report_root/rust.json" \
            --python "$report_root/python.json" \
            --node "$report_root/node.json" \
            --cli "$report_root/cli.json"

      - name: Compare retained-data migration across all public surfaces
        run: |
          report_root="${{ runner.temp }}/multi-ontology-certification"
          mkdir -p "$report_root"
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/rust.json" \
            cargo test -q -p graphforge-api --test multi_ontology_certification \
              retained_data_migrates_atomically_and_exact_identity_reopens
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/cli.json" \
            cargo test -q -p graphforge-cli --test multi_ontology \
              emit_retained_data_certification_report
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/python.json" \
            uv run --no-sync python crates/graphforge-bindings-py/tests/multi_ontology_certification.py
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/node.json" \
            node --test \
              crates/graphforge-bindings-node/tests/multi-ontology-certification.test.mjs
          python3 scripts/ci/compare-multi-ontology-certification.py \
            --rust "$report_root/rust.json" \
            --python "$report_root/python.json" \
            --node "$report_root/node.json" \
            --cli "$report_root/cli.json"

  # The benchmark harness is its own Cargo workspace and Python project. Its
  # runners build against graphforge-api, so the lane follows crate changes.
  benchmarks:
    name: Benchmark Harness
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare native test temporary storage
        run: python3 scripts/test_environment.py --github-env "$GITHUB_ENV"
      - name: Mount sticky target/ disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-benchmarks-rust-1.96.0-target-v1
          path: target
      - name: Mount sticky benchmarks/target/ disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-benchmarks-rust-1.96.0-benchmarks-target-v1
          path: benchmarks/target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # The sticky target disks are shared across branches, and the GDC tests
      # reuse any runner binary that already exists, so build every benchmark
      # binary and gf from this tree first. Cargo is incremental: a no-op when
      # nothing changed.
      - name: Build benchmark binaries and gf from this tree
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path benchmarks/Cargo.toml --bins
          cargo build --locked -p graphforge-cli --bin gf

      # Every benchmarks/tests module, found by unittest discovery so a new
      # one cannot escape CI (#1679).
      - name: Benchmark harness tests (unittest discovery)
        working-directory: benchmarks
        run: >-
          PYTHONPATH=harness uv run --locked python -m unittest discover
          -v -s tests -t . -p 'test_*.py'

      - name: Real tiny and ownership-growth lifecycle producer
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path benchmarks/Cargo.toml \
            --bin graphforge-benchmark-certify \
            --bin graphforge-benchmark-graph500-generator
          python3 benchmarks/runners/graph500-generator/tests/reference/verify_vectors.py
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-graph500-generator
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-gdc-scorecard
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-gdc-snb-bi
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-gdc-snb-interactive
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-gdc-finbench-transaction
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-certify --lib
          cargo build --locked -p graphforge-cli --bin gf
          gf_bin="$GITHUB_WORKSPACE/target/debug/gf"
          test -x "$gf_bin"
          uv run --project benchmarks --locked python \
            benchmarks/scripts/test-tiny-lifecycle-certification.py \
            --gf "$gf_bin" \
            --certify benchmarks/target/debug/graphforge-benchmark-certify \
            --generator benchmarks/target/debug/graphforge-benchmark-graph500-generator \
            --workspace-root "$RUNNER_TEMP"
          uv run --project benchmarks --locked python \
            benchmarks/scripts/test-tiny-lifecycle-certification.py \
            --growth \
            --gf "$gf_bin" \
            --certify benchmarks/target/debug/graphforge-benchmark-certify \
            --generator benchmarks/target/debug/graphforge-benchmark-graph500-generator \
            --workspace-root "$RUNNER_TEMP"


  agent-skills:
    name: Agent Skills
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.agent_skills == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package and offline artifact
        run: |
          pnpm test:agent-skills
          pnpm format:agent-skills
          pnpm smoke:agent-skills

  pulumi-static:
    name: Pulumi Static Validation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.pulumi == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iac/pulumi/typescript/package-lock.json

      - name: Test TypeScript component
        working-directory: iac/pulumi/typescript
        run: |
          npm ci
          npm test
          npm run format:check

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test Python component
        working-directory: iac/pulumi/python
        run: |
          uv sync --extra test --locked
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.254.0

      - name: Preview TypeScript and Python components
        run: iac/pulumi/tests/preview_acceptance.sh

  terraform-static:
    name: Terraform Static Validation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: iac/terraform/provider/go.sum

      - name: Test provider
        working-directory: iac/terraform/provider
        run: |
          gofmt -w .
          git diff --exit-code -- .
          go test -race ./...
          go vet ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Validate offline plan
        env:
          GO: go
          TERRAFORM: terraform
        run: |
          terraform fmt -check -recursive iac/terraform
          iac/terraform/tests/plan.sh

  # The one required status. A lane that did not apply reports skipped; a lane
  # that ran must have passed.
  ci-gate:
    name: CI Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - rust-tests
      - rust-extras
      - feature-boundary
      - bindings
      - windows-storage
      - benchmarks
      - agent-skills
      - pulumi-static
      - terraform-static
    steps:
      - name: Require every lane that ran
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes=$CHANGES lanes: $RESULTS"
          [[ "$CHANGES" == success ]]
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]]
          done
