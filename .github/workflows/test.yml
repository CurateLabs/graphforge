name: Test Suite

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify Changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      gherkin: ${{ steps.filter.outputs.gherkin }}
      bindings: ${{ steps.filter.outputs.bindings }}
      agent_skills: ${{ steps.filter.outputs.agent_skills }}
      pulumi: ${{ steps.filter.outputs.pulumi }}
      terraform: ${{ steps.filter.outputs.terraform }}
      bazel: ${{ steps.filter.outputs.bazel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$BASE" ]]; then
            git fetch --no-tags origin main
            BASE="$(git merge-base origin/main HEAD)"
          fi
          scripts/ci/classify-changes.sh \
            "$BASE" \
            "${{ github.sha }}" >> "$GITHUB_OUTPUT"

  policy:
    name: Repository Policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Always run: suite classifier is self-contained (no needs.changes outputs).
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv for lock validation
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Validate committed Python lock
        run: uv lock --check

      - name: Test Python lock validation policy
        run: python3 scripts/ci/test-python-lock-policy.py

      - name: Classify Repository Policy suites
        id: policy-suites
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$BASE" ]]; then
            git fetch --no-tags origin main
            BASE="$(git merge-base origin/main HEAD)"
          fi
          scripts/ci/classify-policy-suites.sh \
            "$BASE" \
            "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Test changed-path classifier
        run: scripts/ci/test-classify-changes.sh

      - name: Validate authoritative gate registry
        run: |
          python3 scripts/ci/gate-registry.py validate
          python3 scripts/ci/test-gate-registry.py

      - name: Test CodSpeed nightly policy
        run: python3 scripts/ci/test-codspeed-nightly.py

      - name: Test Fly qualification safety contract
        run: python3 scripts/ci/test-fly-filesystem-safety-contract.py

      - name: Test progressive qualification image contract
        run: python3 scripts/ci/test-progressive-qualification-image.py

      - name: Test Repository Policy suite classifier
        run: scripts/ci/test-classify-policy-suites.sh

      - name: Test text checkout byte policy
        run: python3 scripts/ci/test-text-checkout-policy.py

      - name: Validate multi-ontology contract fixtures
        run: python3 scripts/ci/multi-ontology-contract-check.py

      - name: Test multi-ontology four-surface gate
        run: |
          python3 scripts/ci/test-multi-ontology-surface-gate.py
          python3 scripts/ci/test-compare-multi-ontology-parity.py
          python3 scripts/ci/test-compare-multi-ontology-certification.py

      - name: Validate multi-ontology four-surface parity
        run: python3 scripts/ci/multi-ontology-surface-gate.py

      - name: Validate frozen property-overlay surface and counters
        run: |
          python3 scripts/ci/property-overlay-contract.py
          python3 scripts/ci/test-property-overlay-contract.py

      - name: Test aggregate merge gate
        run: scripts/ci/test-require-gates.sh

      - name: Test knowledge contract ledger
        if: steps.policy-suites.outputs.contracts == 'true'
        run: python3 scripts/ci/test-knowledge-contract-gate.py

      - name: Test epistemic contract ledger
        if: steps.policy-suites.outputs.contracts == 'true'
        run: python3 scripts/ci/test-epistemic-contract-gate.py

      - name: Test checkpoint recovery ledger
        if: steps.policy-suites.outputs.contracts == 'true'
        run: python3 scripts/ci/test-checkpoint-recovery-gate.py

      - name: Test concurrency and recovery ledger
        if: steps.policy-suites.outputs.contracts == 'true'
        run: python3 scripts/ci/test-concurrency-recovery-gate.py

      - name: Test durability and isolation contract
        if: steps.policy-suites.outputs.contracts == 'true'
        run: |
          python3 scripts/ci/durability-isolation-gate.py validate
          python3 scripts/ci/test-durability-isolation-gate.py

      - name: Test durability certification gate config
        if: steps.policy-suites.outputs.contracts == 'true'
        run: |
          python3 scripts/ci/durability-certification-gate.py validate
          python3 scripts/ci/test-durability-certification-gate.py

      - name: Test concurrency short matrix gate
        if: steps.policy-suites.outputs.contracts == 'true'
        run: |
          python3 scripts/ci/concurrency-short-gate.py validate
          python3 scripts/ci/test-concurrency-short-gate.py

      - name: Test concurrency stress gate config
        if: steps.policy-suites.outputs.contracts == 'true'
        run: |
          python3 scripts/ci/concurrency-stress-gate.py validate
          python3 scripts/ci/test-concurrency-stress-gate.py

      - name: Test Rust non-Cypher surface inventory
        if: steps.policy-suites.outputs.contracts == 'true'
        run: python3 scripts/ci/test-non-cypher-surface-gate.py

      - name: Test M4 entry baseline contract
        if: steps.policy-suites.outputs.contracts == 'true'
        run: |
          python3 scripts/ci/m4-entry-matrix.py validate
          python3 scripts/ci/test-m4-entry-matrix.py

      - name: Test Rust coverage runner and Cucumber loader policy
        if: steps.policy-suites.outputs.coverage_ledger == 'true'
        run: bash scripts/ci/test-coverage-rust.sh

      - name: Test Rust coverage ledger failure modes
        if: steps.policy-suites.outputs.coverage_ledger == 'true'
        run: python3 scripts/ci/test-rust-coverage-ledger.py

      - name: Test Python and Node non-Cypher parity policy
        if: steps.policy-suites.outputs.binding_parity == 'true'
        run: python3 scripts/ci/check-binding-parity-policy.py

      - name: Validate fail-closed public API BDD policy
        if: steps.policy-suites.outputs.api_bdd == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/api-bdd-policy.py --check-issues
          python3 scripts/ci/test-api-bdd-policy.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: >-
          steps.policy-suites.outputs.release == 'true' ||
          steps.policy-suites.outputs.cli_publish == 'true'
        with:
          node-version: "20"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: >-
          steps.policy-suites.outputs.release == 'true' ||
          steps.policy-suites.outputs.cli_publish == 'true'

      - name: Install pinned napi CLI
        if: >-
          steps.policy-suites.outputs.release == 'true' ||
          steps.policy-suites.outputs.cli_publish == 'true'
        run: pnpm install --frozen-lockfile --filter @curatelabs/graphforge...

      - name: Test binding release-candidate evidence validator
        if: steps.policy-suites.outputs.release == 'true'
        run: python3 scripts/ci/test-binding-release-candidate.py

      - name: Test standardized release load matrix
        if: steps.policy-suites.outputs.release == 'true'
        run: |
          python3 scripts/ci/test-release-load-matrix.py
          python3 scripts/ci/test-release-load-executor.py

      - name: Test final release certification gate
        if: steps.policy-suites.outputs.release == 'true'
        run: python3 scripts/ci/test-release-certification.py

      - name: Test clean-environment verification harness
        if: steps.policy-suites.outputs.clean_env == 'true'
        run: python3 scripts/ci/test-clean-env-verify.py

      - name: Test GraphForge CLI publication contract
        if: steps.policy-suites.outputs.cli_publish == 'true'
        run: python3 scripts/ci/test-publish-cli-contract.py

      - name: Enforce domain dependency directions
        if: steps.policy-suites.outputs.domain_dependencies == 'true'
        run: |
          scripts/ci/check-domain-dependencies.py
          scripts/ci/test-domain-dependencies.py

      - name: Test crates.io publish plan helper
        if: steps.policy-suites.outputs.crate_publish == 'true'
        run: |
          python3 scripts/ci/test-crate-publish-plan.py
          python3 scripts/ci/test-crate-authorize-refresh-nodes.py
          python3 scripts/ci/test-publish-crates.py

      - name: Test release publication preflight
        if: steps.policy-suites.outputs.release == 'true'
        run: |
          python3 scripts/ci/test-release-publish-preflight.py
          python3 scripts/ci/test-release-candidate.py
          python3 scripts/ci/test-prepare-napi-packages.py
          python3 scripts/ci/test-publish-npm-artifacts.py
          python3 scripts/ci/test-amend-npm-main-artifact.py

      - name: Test CI storage policy
        if: steps.policy-suites.outputs.storage == 'true'
        run: python3 scripts/ci/test-ci-storage-policy.py

      - name: Test CI Gate ruleset enforcement contract
        run: python3 scripts/ci/test-verify-ci-gate-enforcement.py

      - name: Validate GitHub Actions workflows
        run: scripts/check-workflows.sh

      - name: Verify license policy
        run: python3 scripts/license_check.py --report license-compliance-report.json

      - name: Detect Cargo lock / deny / notices inputs
        id: cargo-licenses
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$BASE" ]]; then
            git fetch --no-tags origin main
            BASE="$(git merge-base origin/main HEAD)"
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -Eq \
            '^(Cargo\.lock|deny\.toml|about\.toml|scripts/generate_third_party_notices\.py|THIRD_PARTY_NOTICES\.md)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.cargo-licenses.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo registry
        if: steps.cargo-licenses.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-deny and cargo-about
        if: steps.cargo-licenses.outputs.run == 'true'
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.1

      - name: Check third-party Rust license allowlist
        if: steps.cargo-licenses.outputs.run == 'true'
        run: cargo deny check licenses

      - name: Fetch crate sources for offline notice generation
        if: steps.cargo-licenses.outputs.run == 'true'
        run: cargo fetch --locked

      - name: Verify generated third-party notices
        if: steps.cargo-licenses.outputs.run == 'true'
        run: python3 scripts/generate_third_party_notices.py --check

  python-quality:
    name: Python Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Type-check Python binding
        run: >-
          uv run mypy crates/graphforge-bindings-py/python/graphforge
          --strict-optional --show-error-codes

      - name: Scan Python binding
        run: uv run bandit -c pyproject.toml -r crates/graphforge-bindings-py/python

  gherkin-lint:
    name: Gherkin Syntax
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.gherkin == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install

      - name: Validate Gherkin syntax
        shell: bash
        run: |
          node tests/features/node/node_modules/@cucumber/cucumber/bin/cucumber.js \
            "tests/features/api/**/*.feature" \
            "tests/features/tck/features/**/*.feature" \
            --dry-run --no-strict > /tmp/gherkin-lint.log 2>&1 || EC=$?
          EC=${EC:-0}
          cat /tmp/gherkin-lint.log
          if grep -iE "^Parse error|^SyntaxError|^Error: Parse" /tmp/gherkin-lint.log; then
            echo "Gherkin parse errors found"
            exit 1
          fi
          if [[ "$EC" -ne 0 && "$EC" -ne 2 ]]; then
            echo "cucumber-js exited with unexpected code $EC"
            exit "$EC"
          fi

  agent-skills:
    name: Agent Skills
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.agent_skills == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package and offline artifact
        run: |
          pnpm test:agent-skills
          pnpm format:agent-skills
          pnpm smoke:agent-skills

  pulumi-static:
    name: Pulumi Static Validation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.pulumi == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iac/pulumi/typescript/package-lock.json

      - name: Test TypeScript component
        working-directory: iac/pulumi/typescript
        run: |
          npm ci
          npm test
          npm run format:check

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test Python component
        working-directory: iac/pulumi/python
        run: |
          uv sync --extra test --locked
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.254.0

      - name: Preview TypeScript and Python components
        run: iac/pulumi/tests/preview_acceptance.sh

  terraform-static:
    name: Terraform Static Validation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: iac/terraform/provider/go.sum

      - name: Test provider
        working-directory: iac/terraform/provider
        run: |
          gofmt -w .
          git diff --exit-code -- .
          go test -race ./...
          go vet ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Validate offline plan
        env:
          GO: go
          TERRAFORM: terraform
        run: |
          terraform fmt -check -recursive iac/terraform
          iac/terraform/tests/plan.sh

  rust-lint:
    name: Rust Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      # No Cargo sticky disk after #4 cutover; fmt/clippy remain Cargo diagnostics.
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Validate Python test and extension build modes
        run: |
          python3 scripts/ci/python-build-mode-check.py
          python3 scripts/ci/test-python-build-mode-check.py

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

  python-binding:
    name: Python Binding
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: >-
      needs.changes.outputs.bindings == 'true' ||
      needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pnpm for cross-package publication tests
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node for cross-package publication tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install workspace dependencies for cross-package publication tests
        run: pnpm install --frozen-lockfile

      # PR binding assembly still uses maturin for acceptance suites; sticky
      # Cargo target/ disks are retired after #4 (Binding RC retains sticky).
      - name: Cache Cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Build same-SHA wheel
        shell: bash
        run: >-
          uvx maturin build
          --manifest-path crates/graphforge-bindings-py/Cargo.toml
          --profile dev
          --out dist

      - name: Prove make install preserves the native wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python3 scripts/ci/test-make-install-preserves-native-wheel.py "${wheels[0]}"

      - name: Prove isolated native package
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uvx --from "${wheels[0]}" graphforge --version
          GRAPHFORGE_UVX_WHEEL="${wheels[0]}" \
            python3 crates/graphforge-bindings-py/tests/cli_lifecycle.py
          uv venv /tmp/gf-native --python 3.13
          uv pip install --python /tmp/gf-native/bin/python "${wheels[0]}"
          /tmp/gf-native/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("networkx") is None
          assert importlib.util.find_spec("igraph") is None
          PY
          for test_file in crates/graphforge-bindings-py/tests/*.py; do
            /tmp/gf-native/bin/python "$test_file"
          done
          /tmp/gf-native/bin/python crates/graphforge-bindings-py/tests/multi_ontology.py
          GRAPHFORGE_PYTHON_PARITY_REPORT=dist/python-non-cypher-classification.json \
            /tmp/gf-native/bin/python \
            crates/graphforge-bindings-py/tests/non_cypher_release.py \
            --classification-only

      - name: Install test dependencies and wheel
        shell: bash
        run: |
          uv sync --locked --all-extras
          uv pip install dist/*.whl

      - name: Restore SNAP ego-Facebook fixture
        id: snap-fixture
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.graphforge/datasets/snap-ego-facebook.txt.gz
          key: ${{ runner.os }}-snap-ego-facebook-v1

      - name: Download SNAP ego-Facebook fixture
        if: steps.snap-fixture.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.graphforge/datasets
          dest="$HOME/.graphforge/datasets/snap-ego-facebook.txt.gz"
          # Prefer the checked-in CI fixture. snap.stanford.edu is intermittently
          # unreachable from CI egress (connection reset), which is unrelated to
          # binding correctness.
          if [[ -s tests/fixtures/snap-ego-facebook.txt.gz ]]; then
            cp tests/fixtures/snap-ego-facebook.txt.gz "$dest"
          else
            for attempt in 1 2 3 4 5; do
              if curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 30 --max-time 120 \
                --output "$dest" \
                https://snap.stanford.edu/data/facebook_combined.txt.gz; then
                break
              fi
              echo "SNAP download attempt ${attempt} failed; sleeping before retry"
              sleep $((attempt * 5))
            done
          fi
          test -s "$dest"
          echo "125e84db872eeba443d270c70315c256b0af43a502fcfe51f50621166ad035d7  $dest" \
            | shasum -a 256 -c -

      - name: Run Python unit, integration, and BDD tests
        shell: bash
        run: |
          test -s ~/.graphforge/datasets/snap-ego-facebook.txt.gz
          uv run --no-sync pytest tests/unit tests/integration tests/features \
            -n auto --tb=short

      - name: Prove public API BDD mutations fail closed
        run: uv run --no-sync python scripts/ci/test-api-bdd-mutations.py

      - name: Run audited downstream consumers
        env:
          GRAPHFORGE_WHEEL_SHA: ${{ github.sha }}
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python scripts/ci/run-native-consumers.py

      - name: Execute the agent-grounding notebook twice
        env:
          GRAPHFORGE_WHEEL_SHA: ${{ github.sha }}
        run: >-
          uv run --isolated --no-project
          --with dist/*.whl
          --with nbclient==0.11.0
          --with ipykernel==7.3.0
          python scripts/ci/run-native-notebook.py

      - name: Record and upload wheel provenance
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/artifact-sha
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python3 scripts/ci/write-binding-parity-evidence.py \
            --language python \
            --artifact "${wheels[0]}" \
            --classification dist/python-non-cypher-classification.json \
            --package-manifest crates/graphforge-bindings-py/pyproject.toml \
            --case check_surface_projection \
            --case check_native_artifact_and_no_fallback \
            --case check_lifecycle_checkpoint_errors_and_reopen \
            --case check_knowledge_epistemic_native_projection \
            --output dist/python-binding-parity-evidence.json

      - name: Upload same-SHA wheel for concurrency matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-python-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  node-binding:
    name: Node Binding
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: >-
      needs.changes.outputs.bindings == 'true' ||
      needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"

      # PR binding assembly still uses napi for acceptance suites; sticky
      # Cargo target/ disks are retired after #4 (Binding RC retains sticky).
      - name: Cache Cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Install workspace dependencies
        run: pnpm install

      - name: Build same-SHA addon
        # Pull requests need a behaviorally correct native addon, not release
        # code generation. Cross-platform release builds remain in publish.yaml.
        run: pnpm --filter @curatelabs/graphforge exec napi build --platform

      - name: Run Node acceptance tests
        shell: bash
        run: |
          pnpm --filter @curatelabs/graphforge test:smoke
          pnpm --filter @curatelabs/graphforge test
          pnpm --filter @curatelabs/graphforge format:check
          pnpm test:node-cli
          pnpm format:node-cli
          pnpm smoke:node-cli
          pnpm --filter @curatelabs/graphforge-cli test:lifecycle

      - name: Typecheck Node BDD package
        run: |
          pnpm --filter @curatelabs/graphforge-bdd-node typecheck
          pnpm --filter @curatelabs/graphforge-bdd-node typecheck:fail-closed

      - name: Run Node BDD suite
        working-directory: tests/features/node
        shell: bash
        run: |
          node node_modules/@cucumber/cucumber/bin/cucumber.js \
            "../api/**/*.feature" \
            --require-module tsx/cjs \
            --require "step_definitions/**/*.ts" \
            --tags "not @excluded-api-bdd and not @excluded-node-api-bdd" \
            --format summary

      - name: Record and upload addon parity evidence
        shell: bash
        run: |
          addons=(crates/graphforge-bindings-node/*.node)
          test "${#addons[@]}" -eq 1
          python3 scripts/ci/write-binding-parity-evidence.py \
            --language node \
            --artifact "${addons[0]}" \
            --classification crates/graphforge-bindings-node/tests/non-cypher-parity-policy.json \
            --package-manifest crates/graphforge-bindings-node/package.json \
            --case "the Node classification is total, frozen, and backed by non-skipped native tests" \
            --case "the native Node facade preserves deterministic IPC through persistence and reopen" \
            --case "a future project format fails structurally without mutating the project" \
            --output crates/graphforge-bindings-node/node-binding-parity-evidence.json

      - name: Upload same-SHA addon for concurrency matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-node-addon-${{ github.sha }}
          path: |
            crates/graphforge-bindings-node/*.node
            crates/graphforge-bindings-node/index.js
            crates/graphforge-bindings-node/index.d.ts
          if-no-files-found: error
          retention-days: 1

  concurrency-matrix:
    name: Concurrency Matrix
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes, python-binding, node-binding]
    if: >-
      always() &&
      (needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.bindings == 'true') &&
      needs.python-binding.result == 'success' &&
      needs.node-binding.result == 'success'
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download same-SHA Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-python-wheel-${{ github.sha }}
          path: dist

      - name: Download same-SHA Node addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-node-addon-${{ github.sha }}
          path: crates/graphforge-bindings-node

      - name: Install shared native artifacts
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          addons=(crates/graphforge-bindings-node/*.node)
          test "${#addons[@]}" -eq 1
          uv venv /tmp/gf-concurrency --python 3.13
          uv pip install --python /tmp/gf-concurrency/bin/python "${wheels[0]}"
          pnpm install --frozen-lockfile

      - name: Compare real multi-ontology semantics across all public surfaces
        shell: bash
        run: |
          report_root="${{ runner.temp }}/multi-ontology-parity"
          mkdir -p "$report_root"
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/rust.json" \
            cargo test -q -p graphforge-api --lib \
              writes_canonical_rust_semantic_parity_report_when_requested
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/cli.json" \
            cargo test -q -p graphforge-cli --test multi_ontology \
              emit_authenticated_parity_report
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/python.json" \
            /tmp/gf-concurrency/bin/python \
              crates/graphforge-bindings-py/tests/multi_ontology.py
          GRAPHFORGE_MULTI_ONTOLOGY_PARITY_REPORT="$report_root/node.json" \
            node --test crates/graphforge-bindings-node/tests/multi-ontology.test.mjs
          python3 scripts/ci/compare-multi-ontology-parity.py \
            --rust "$report_root/rust.json" \
            --python "$report_root/python.json" \
            --node "$report_root/node.json" \
            --cli "$report_root/cli.json"

      - name: Certify retained-data migration across all public surfaces
        shell: bash
        run: |
          report_root="${{ runner.temp }}/multi-ontology-certification"
          mkdir -p "$report_root"
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/rust.json" \
            cargo test -q -p graphforge-api --test multi_ontology_certification \
              retained_data_migrates_atomically_and_exact_identity_reopens
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/cli.json" \
            cargo test -q -p graphforge-cli --test multi_ontology \
              emit_retained_data_certification_report
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/python.json" \
            /tmp/gf-concurrency/bin/python \
              crates/graphforge-bindings-py/tests/multi_ontology_certification.py
          GRAPHFORGE_MULTI_ONTOLOGY_CERTIFICATION_REPORT="$report_root/node.json" \
            node --test \
              crates/graphforge-bindings-node/tests/multi-ontology-certification.test.mjs
          python3 scripts/ci/compare-multi-ontology-certification.py \
            --rust "$report_root/rust.json" \
            --python "$report_root/python.json" \
            --node "$report_root/node.json" \
            --cli "$report_root/cli.json"

      - name: Run required short concurrency matrix
        shell: bash
        run: >-
          /tmp/gf-concurrency/bin/python
          scripts/ci/concurrency-short-gate.py run
          --output "${{ runner.temp }}/concurrency-short-evidence"

