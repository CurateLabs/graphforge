  bazel-bootstrap:
    # Job display name kept for continuity; this is the authoritative Rust
    # compile/test path under CI Gate after #4 cutover.
    name: Bazel Bootstrap
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    # Authoritative drift/ledger/tests/binding smokes only. Diagnostics live in
    # bazel-diagnostics (not required by CI Gate).
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bazelisk
        run: |
          version=1.26.0
          # SHA-256 of bazelisk-linux-amd64 from
          # https://github.com/bazelbuild/bazelisk/releases/tag/v1.26.0
          # Computed locally: curl -fsSL … | shasum -a 256
          checksum=6539c12842ad76966f3d493e8f80d67caa84ec4a000e220d5459833c967c12bc
          tmp=$(mktemp)
          curl -fsSL \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${version}/bazelisk-linux-amd64" \
            -o "$tmp"
          printf '%s  %s\n' "$checksum" "$tmp" | shasum -a 256 --check
          sudo install -m 0755 "$tmp" /usr/local/bin/bazelisk
          rm -f "$tmp"
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazelisk version

      - name: Install uv for benchmark fixture validation
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Test offline progressive provider boundary
        working-directory: benchmarks
        run: |
          PYTHONPATH=harness uv run --locked python -m unittest \
            tests.test_progressive_esc \
            tests.test_progressive_fly_transport \
            tests.test_progressive_provider_attempt \
            tests.test_progressive_provider_plan \
            tests.test_progressive_provider_run \
            tests.test_progressive_run \
            tests.test_qualification_operator

      - name: Cargo feature drift check (fail-closed)
        run: |
          python3 scripts/ci/cargo-bazel-drift-check.py
          python3 scripts/ci/test-cargo-bazel-drift-check.py

      - name: Migration ledger + release platform inventory (fail-closed)
        run: |
          python3 scripts/ci/bazel-migration-ledger-check.py
          python3 scripts/ci/test-bazel-migration-ledger-check.py
          python3 scripts/ci/test-cargo-bazel-parity-check.py

      # Live suite-membership gate: every mapped integration-test label must be
      # reachable from tests(//:ci_rust_tests). Required path must exercise the
      # live bazelisk query (unit-test harness may skip it).
      - name: Live suite-membership inventory (fail-closed)
        run: |
          python3 scripts/ci/cargo-bazel-parity-check.py --mode inventory

      - name: Blacksmith remote-cache policy + harness unit tests
        run: |
          # Do not set --remote_cache; Blacksmith injects repository cache.
          # Strict evaluate of checked-in perf-sample.json is one-shot Bazel-migration
          # evidence (see bazel-migration-perf.md), not a live regression gate;
          # observation/collect lives in bazel-diagnostics.
          python3 scripts/ci/bazel-cache-perf.py --mode policy
          python3 scripts/ci/test-bazel-cache-perf.py

      - name: Prepare Bazel evidence directory
        run: mkdir -p dist

      - name: Authoritative Bazel Rust tests + first-party libs/CLI/resources
        shell: bash
        run: |
          # Do not set --remote_cache; Blacksmith injects repository cache.
          bazelisk test --config=ci //:ci_rust_tests 2>&1 | tee dist/bazel-ci-rust-tests.log
          bazelisk build --config=ci \
            //:bazel_smoke \
            //:first_party_libs \
            //:runtime_libs \
            //:cli_bins \
            //:resource_inputs \
            //:release_bins 2>&1 | tee dist/bazel-representative-build.log

      - name: Real tiny progressive lifecycle producer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path benchmarks/Cargo.toml \
            --bin graphforge-benchmark-certify \
            --bin graphforge-benchmark-graph500-generator
          python3 benchmarks/runners/graph500-generator/tests/reference/verify_vectors.py
          cargo test --locked --manifest-path benchmarks/Cargo.toml \
            -p graphforge-benchmark-graph500-generator
          bazelisk build --config=ci //crates/graphforge-cli:gf
          gf_bin=$(bazelisk cquery --config=ci --output=files //crates/graphforge-cli:gf | tail -n 1)
          test -x "$gf_bin"
          uv run --project benchmarks --locked python \
            benchmarks/scripts/test-tiny-lifecycle-certification.py \
            --gf "$gf_bin" \
            --certify benchmarks/target/debug/graphforge-benchmark-certify \
            --generator benchmarks/target/debug/graphforge-benchmark-graph500-generator \
            --workspace-root "$RUNNER_TEMP"

      - name: Bazel binding cdylibs + packaging handoff
        run: |
          set -euo pipefail
          # Do not set --remote_cache; Blacksmith injects repository cache.
          mkdir -p dist
          bazelisk build --config=ci //:binding_cdylibs //:python_wheel_smoke //:node_package_smoke \
            2>&1 | tee dist/bazel-binding-build.log
          python3 scripts/ci/test-assemble-bazel-binding-packages.py

  bazel-diagnostics:
    # Non-required parity/cache diagnostics are intentionally disabled for
    # pull requests. Preserve the recipe until it moves to maintenance CI.
    name: Bazel Diagnostics
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.bazel == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bazelisk
        run: |
          version=1.26.0
          # SHA-256 of bazelisk-linux-amd64 from
          # https://github.com/bazelbuild/bazelisk/releases/tag/v1.26.0
          # Computed locally: curl -fsSL … | shasum -a 256
          checksum=6539c12842ad76966f3d493e8f80d67caa84ec4a000e220d5459833c967c12bc
          tmp=$(mktemp)
          curl -fsSL \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${version}/bazelisk-linux-amd64" \
            -o "$tmp"
          printf '%s  %s\n' "$checksum" "$tmp" | shasum -a 256 --check
          sudo install -m 0755 "$tmp" /usr/local/bin/bazelisk
          rm -f "$tmp"
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazelisk version

      - name: Prepare Bazel diagnostic evidence directory
        run: mkdir -p dist

      - name: Same-SHA Cargo/Bazel dual-build parity (diagnostic, one release cycle)
        run: |
          # Cargo is no longer authoritative under CI Gate (#4). Keep same-SHA
          # parity as a diagnostic for one release cycle; see cutover rollback doc.
          # Do not set --remote_cache; Blacksmith injects repository cache.
          python3 scripts/ci/cargo-bazel-parity-check.py \
            --mode all \
            --write-evidence "dist/cargo-bazel-parity-evidence.json"

      - name: Cache-unavailable cold correctness + warm observation (#5)
        run: |
          set -euo pipefail
          # Cold correctness clears remote/disk cache via CLI only (not checked in).
          mkdir -p dist
          python3 scripts/ci/bazel-cache-perf.py --mode cold-correctness
          python3 scripts/ci/bazel-cache-perf.py --mode observe-warm \
            --write dist/bazel-warm-observation.json
          python3 scripts/ci/bazel-cache-perf.py --mode affected-inputs \
            --write dist/bazel-affected-inputs.json
          # Representative build for log parse (fail closed; no fabricated hits).
          bazelisk build \
            //:bazel_smoke \
            //:first_party_libs \
            //:runtime_libs \
            //:cli_bins \
            //:resource_inputs \
            //:release_bins 2>&1 | tee dist/bazel-representative-build.log
          python3 scripts/ci/bazel-cache-perf.py --mode parse-log \
            --log dist/bazel-representative-build.log \
            > dist/bazel-representative-build.summary.json
          # Collect ≥10 cold/warm pairs only when remote hits are observed and
          # checked-in evidence is still incomplete. Skip the long loop when the
          # org-admin remote cache is still inactive. Checked-in perf-sample.json
          # is one-shot Bazel-migration evidence, not a live regression gate.
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path("docs/development/bazel-migration-evidence/perf-sample.json").read_text()
          )
          print(payload.get("status", "unknown"))
          PY
          )"
          hits="$(python3 - <<'PY'
          import json
          from pathlib import Path
          warm = json.loads(Path("dist/bazel-warm-observation.json").read_text())
          print("yes" if warm.get("remote_cache_hits_observed") else "no")
          PY
          )"
          if [[ "$status" == "complete" ]]; then
            cp docs/development/bazel-migration-evidence/perf-sample.json \
              dist/perf-sample-collected.json
          elif [[ "$hits" == "yes" ]]; then
            python3 scripts/ci/bazel-cache-perf.py --mode collect-pairs --pairs 10 \
              --evidence docs/development/bazel-migration-evidence/perf-sample.json \
              --write dist/perf-sample-collected.json
          else
            cp docs/development/bazel-migration-evidence/perf-sample.json \
              dist/perf-sample-collected.json
            echo "skipping collect-pairs: no remote cache hits observed yet"
          fi
          python3 - <<'PY'
          import json
          import importlib.util
          from pathlib import Path

          dist = Path("dist")
          warm = json.loads((dist / "bazel-warm-observation.json").read_text())
          affected = json.loads((dist / "bazel-affected-inputs.json").read_text())
          evidence = json.loads((dist / "perf-sample-collected.json").read_text())
          obs = evidence.setdefault("observations", {})
          obs["cache_unavailable_cold_correct"] = True
          obs["affected_inputs_isolation"] = bool(affected.get("passed"))
          if warm.get("remote_cache_hits_observed") or evidence.get("collection", {}).get(
              "remote_cache_hits_seen"
          ):
              obs["remote_cache_hits_on_identical_sha"] = True
          links = evidence.setdefault("blacksmith_dashboard_links", [])
          run_url = (evidence.get("collection") or {}).get("run_url")
          for url in (run_url, "https://app.blacksmith.sh/cache"):
              if url and url not in links:
                  links.append(url)

          spec = importlib.util.spec_from_file_location(
              "bazel_cache_perf", "scripts/ci/bazel-cache-perf.py"
          )
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          # One-shot Bazel-migration evidence evaluation for observation rollup only; not a
          # required CI Gate regression gate.
          eval_payload = mod.evaluate_evidence(evidence)
          evidence["gates"] = {
              "passed": bool(eval_payload.get("passed")),
              "reason": eval_payload.get("reason"),
              "warm_speedup": eval_payload.get("warm_speedup"),
              "compute_reduction": eval_payload.get("compute_reduction"),
              "cold_regression": eval_payload.get("cold_regression"),
              "pair_count": eval_payload.get("pair_count"),
          }
          if eval_payload.get("passed"):
              evidence["status"] = "complete"
              evidence.pop("blocker", None)
          (dist / "perf-sample-collected.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          hits = bool(obs.get("remote_cache_hits_on_identical_sha"))
          summary = {
              "schema": "graphforge.bazel-cache-perf-ci-observation.v1",
              "warm_observation": warm,
              "affected_inputs": affected,
              "remote_cache_hits_observed": hits,
              "org_admin_blocker_likely": not hits,
              "evidence_status": evidence.get("status"),
              "evaluate": eval_payload,
              "note": "perf-sample.json is one-shot Bazel-migration evidence; not a live CI Gate gate",
          }
          (dist / "bazel-cache-perf-ci-observation.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload Cargo/Bazel parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-bazel-parity-evidence-${{ github.run_id }}
          path: dist/cargo-bazel-parity-evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Bazel cache/perf observation (#5)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-cache-perf-evidence-${{ github.run_id }}
          path: |
            dist/bazel-warm-observation.json
            dist/bazel-affected-inputs.json
            dist/bazel-cache-perf-ci-observation.json
            dist/bazel-representative-build.summary.json
            dist/perf-sample-collected.json
            docs/development/bazel-migration-evidence/perf-sample.json
          if-no-files-found: error
          retention-days: 1

  ci-gate:
    name: CI Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    timeout-minutes: 10
    needs:
      - changes
      - policy
      - python-quality
      - gherkin-lint
      - agent-skills
      - pulumi-static
      - terraform-static
      - rust-lint
      - python-binding
      - node-binding
      - concurrency-matrix
      - windows-graphforge-storage-locks
      - macos-graphforge-storage-durability
      - native-durability-aggregate
      - bazel-bootstrap
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every applicable gate
        run: >-
          scripts/ci/require-gates.sh
          "${{ needs.changes.result }}"
          "${{ needs.policy.result }}"
          "${{ needs.python-quality.result }}"
          "${{ needs.gherkin-lint.result }}"
          "${{ needs.agent-skills.result }}"
          "${{ needs.pulumi-static.result }}"
          "${{ needs.terraform-static.result }}"
          "${{ needs.rust-lint.result }}"
          "${{ needs.python-binding.result }}"
          "${{ needs.node-binding.result }}"
          "${{ needs.concurrency-matrix.result }}"
          "${{ needs.windows-graphforge-storage-locks.result }}"
          "${{ needs.macos-graphforge-storage-durability.result }}"
          "${{ needs.native-durability-aggregate.result }}"
          "${{ needs.bazel-bootstrap.result }}"
