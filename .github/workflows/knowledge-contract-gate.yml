name: Knowledge Contract Gate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_closure_report:
        description: Build the SHA-bound evidence report when explicitly requested by a caller.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust contract rows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Execute Rust matrix group
        run: python3 scripts/ci/knowledge-contract-gate.py run-group --group rust --output gate-fragments
      - name: Save Rust evidence for report job
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gate-fragments/
          key: knowledge-transfer-${{ github.run_id }}-rust

  report:
    name: SHA-bound closure report
    if: always() && (github.event_name == 'workflow_dispatch' || inputs.require_closure_report)
    needs: [rust]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gate-fragments
          key: knowledge-transfer-${{ github.run_id }}-rust
          fail-on-cache-miss: true
      - name: Build exact closure report
        run: >-
          python3 scripts/ci/knowledge-contract-gate.py report
          --sha "${{ github.sha }}"
          --fragments gate-fragments
          --output gate-report
