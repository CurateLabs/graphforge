name: CodSpeed

# Nightly performance measurement for the Rust surface. Benchmarks are
# divan targets built through `cargo codspeed` and measured with CodSpeed's
# CPU simulation instrument for pure kernels and CodSpeed Macro Runners for
# durable I/O walltime. Cargo builds here are diagnostics-only: Bazel remains
# the authoritative compile/test surface (see .github/workflows/README.md).
#
# CodSpeed compares each run against the previous one, which catches a step
# regression and nothing else. The ingest floor gate in `m6-walltime` is the
# other half: it fails when a measurement crosses its banked constant in
# either direction — worse is a regression, better by more than the metric's
# margin is an unbanked gain whose failure prints the constant to write
# (#1476) — so a slow drift that never regresses in a single step cannot pass
# indefinitely, and an improvement cannot land unrecorded (#1387).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  actions: read
  contents: read
  # OpenID Connect authentication with CodSpeed (no long-lived token).
  id-token: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  nightly:
    name: Check Latest Main
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      should-run: ${{ steps.decision.outputs.should-run }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Resolve latest main SHA
        id: main
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find latest successful nightly SHA
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=""
          if curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/codspeed.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
            --output nightly-runs.json; then
            previous="$(python3 -c 'import json; data=json.load(open("nightly-runs.json", encoding="utf-8")); runs=data.get("workflow_runs", []); print(runs[0]["head_sha"] if runs else "")')"
          fi
          echo "sha=$previous" >> "$GITHUB_OUTPUT"
      - name: Decide whether benchmarks are needed
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          if [[ "${{ github.event_name }}" == "schedule" && "${{ steps.previous.outputs.sha }}" == "${{ steps.main.outputs.sha }}" ]]; then
            should_run=false
          fi
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"

  benchmarks:
    name: Rust Benchmarks
    needs: nightly
    if: needs.nightly.outputs.should-run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.nightly.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-codspeed@5.0.1

      - name: Build benchmark targets
        run: |
          cargo codspeed build -m simulation -p graphforge-core -p graphforge-cypher
          cargo codspeed build -m simulation -p graphforge-storage --bench m6_storage

      - name: Verify fail-closed M6 benchmark inventory
        run: python3 scripts/ci/check-m6-benchmarks.py

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: cargo codspeed run

  m6-walltime:
    name: M6 Durable Walltime (CodSpeed Macro ARM64)
    needs: nightly
    if: needs.nightly.outputs.should-run == 'true'
    # Walltime comparisons require CodSpeed's isolated bare-metal runner.
    # Shared hosted runners are intentionally not a fallback.
    runs-on: codspeed-macro
    # Bulk ingest at 8.4M edges is minutes of real durability work, not the
    # seconds the control-plane cases take.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.nightly.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-codspeed@5.0.1
      # Banked floor, ceilings and the size-to-size ratio, judged on both sides
      # (regression and unbanked gain) before the measured run so a breach
      # fails the nightly fast. The bench binary's `main` switches to the gate
      # on this variable; the shared `bench` profile output is reused by the
      # CodSpeed walltime build below.
      - name: Enforce the ingest throughput gate
        env:
          GF_INGEST_FLOOR_GATE: "1"
          GF_INGEST_FLOOR_GATE_JSON: ingest-floor-gate.json
        run: cargo bench -p graphforge-storage --bench m6_storage_io
      # One-day transfer retention, matching the storage policy for a nightly
      # measurement: this is neither a publication nor a certification artifact.
      # The durable record of the numbers is the CodSpeed walltime series and
      # the gate step's own log.
      - name: Record the ingest floor gate measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingest-floor-gate-${{ needs.nightly.outputs.sha }}
          path: ingest-floor-gate.json
          if-no-files-found: error
          retention-days: 1
      - name: Build durable filesystem benchmarks only
        run: cargo codspeed build -m walltime -p graphforge-storage --bench m6_storage_io
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: cargo codspeed run

  m6-memory-fallback:
    name: M6 Scheduled Peak Memory Artifact
    needs: nightly
    if: github.event_name == 'workflow_dispatch' && needs.nightly.outputs.should-run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.nightly.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Compile M6 storage benchmarks
        run: cargo bench -p graphforge-storage --bench m6_storage --bench m6_storage_io --no-run
      - name: Record replay peak resident memory
        run: /usr/bin/time -v cargo bench -p graphforge-storage --bench m6_storage replay_merge_fingerprint -- --sample-count 10 2> replay-memory.txt
      - name: Record compaction peak resident memory
        run: /usr/bin/time -v cargo bench -p graphforge-storage --bench m6_storage_io spill_compaction -- --sample-count 10 2> compaction-memory.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-memory-${{ github.sha }}-blacksmith-4vcpu-ubuntu-2404
          path: |
            replay-memory.txt
            compaction-memory.txt
          if-no-files-found: error
          retention-days: 1
