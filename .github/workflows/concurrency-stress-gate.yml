name: Concurrency Stress Gate

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      iterations:
        description: Fixed mixed-workload iteration count
        required: false
        default: "24"
        type: string

permissions:
  contents: read

concurrency:
  group: concurrency-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: Bounded-resource concurrency stress
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      GF_STRESS_SEED: "2417"
      GF_STRESS_ITERATIONS: ${{ github.event.inputs.iterations || '24' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-concurrency-stress-v1-${{ hashFiles('Cargo.lock', 'crates/**/*.rs') }}

      - name: Validate stress configuration
        run: |
          python3 scripts/ci/concurrency-stress-gate.py validate
          python3 scripts/ci/test-concurrency-stress-gate.py

      - name: Build native Python wheel for mixed workload
        run: |
          uvx maturin build \
            --manifest-path crates/gf-bindings-py/Cargo.toml \
            --profile dev \
            --out dist
          uv venv /tmp/gf-concurrency-stress --python 3.13
          uv pip install --python /tmp/gf-concurrency-stress/bin/python dist/*.whl

      - name: Run bounded-resource stress lane
        run: >-
          /tmp/gf-concurrency-stress/bin/python
          scripts/ci/concurrency-stress-gate.py run
          --seed "${GF_STRESS_SEED}"
          --iterations "${GF_STRESS_ITERATIONS}"
          --output "${{ runner.temp }}/concurrency-stress-evidence"
