name: Publish

# One workflow builds every artifact from one commit and publishes it.
#
# - Pushing a `v*` tag publishes to crates.io, PyPI, and npm, then creates the
#   GitHub Release.
# - A manual run, or a pull request that touches the release path, is a dry
#   run: it builds, packs, and smoke-tests everything and uploads nothing.
# - Re-running a tag run is safe: every registry step skips a version (on PyPI,
#   a file) that is already published.
#
# The registries' trusted-publishing settings name this file (`publish.yaml`)
# and the `release` environment. Renaming either breaks publishing until the
# registry settings are changed to match.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish.yaml
      - scripts/publish_crates.py
      - scripts/publish_npm.py
      - scripts/set_release_version.py
      - scripts/ci/crate-publish-plan.py
      - scripts/ci/prepare-napi-packages.py
      - scripts/ci/validate-napi-artifacts.py
      - scripts/ci/multi-ontology-packaged-smoke.mjs

permissions:
  contents: read

# One publish lane per ref; never cancel an in-flight registry write.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Release version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
      npm_dist_tag: ${{ steps.version.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Require one version across Cargo, Python, and Node
        run: uv run --no-project --with packaging python scripts/set_release_version.py --check
      - name: Derive the version and require the tag to match it
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 scripts/publish_npm.py --print-version)"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "tag $REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == tag && "$version" == *dev* ]]; then
            echo "a development version ($version) is not released" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm_version="$(python3 -c 'import json; print(json.load(open("crates/graphforge-bindings-node/package.json"))["version"])')"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$(python3 scripts/publish_npm.py --print-dist-tag)" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `manylinux: "2_17"` builds Linux inside maturin-action's manylinux2014
          # (glibc 2.17) container and passes `--manylinux 2_17`, so maturin's
          # own audit refuses the wheel rather than relabel it if any symbol
          # needs a newer glibc (#1645).
          - { os: blacksmith-4vcpu-ubuntu-2404, target: linux-x86_64, wheel_tag: cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64 }
          - { os: blacksmith-12vcpu-macos-15, target: macos-arm64, wheel_tag: cp310-abi3-macosx_11_0_arm64 }
          - { os: blacksmith-8vcpu-windows-2025, target: windows-amd64, wheel_tag: cp310-abi3-win_amd64 }
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Build native abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --manifest-path crates/graphforge-bindings-py/Cargo.toml --out dist
          # Linux only; macOS and Windows ignore it.
          manylinux: "2_17"
          sccache: "false"

      - name: Require the declared wheel platform tag
        shell: bash
        env:
          WHEEL_TAG: ${{ matrix.wheel_tag }}
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          case "${wheels[0]}" in
            *"-${WHEEL_TAG}.whl") ;;
            *) printf 'wheel %s does not carry tag %s\n' "${wheels[0]}" "$WHEEL_TAG" >&2; exit 1 ;;
          esac

      # The manylinux container writes target/ as root; reclaim it so the
      # installed-wheel tests can launch Cargo on the host runner.
      - name: Reclaim Cargo target ownership after manylinux maturin
        if: runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" "$CARGO_TARGET_DIR"

      - name: Install the wheel in a clean environment and run it
        shell: bash
        run: |
          wheels=(dist/*.whl)
          for test_file in \
            crates/graphforge-bindings-py/tests/smoke.py \
            crates/graphforge-bindings-py/tests/gil_release.py \
            crates/graphforge-bindings-py/tests/multi_ontology.py; do
            uv run --isolated --no-project --with "${wheels[0]}" python "$test_file"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Python source distribution
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the sdist
        run: uvx --from 'maturin>=1.7,<2.0' maturin sdist --manifest-path crates/graphforge-bindings-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  addons:
    name: Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-12vcpu-macos-15
            target: x86_64-apple-darwin
            node_arch: x64
            run_addon: "true"
          - os: blacksmith-12vcpu-macos-15
            target: aarch64-apple-darwin
            node_arch: arm64
            run_addon: "true"
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            # The napi cross toolchain links against glibc 2.17, the floor the
            # Linux wheel and the aarch64 addon already meet; a native build on
            # this Ubuntu 24.04 runner required glibc 2.39 (#1670). Its
            # toolchain unpacker needs Node 22 (see the aarch64 lane), so the
            # lane builds on Node 22 and executes the addon on the Node 20
            # `engines.node` floor.
            cross_args: --use-napi-cross
            node_arch: x64
            node_version: "22"
            runtime_node_version: "20"
            glibc_floor: "2.17"
            run_addon: "true"
            # The npm packages job packs this lane's napi-generated index.js /
            # index.d.ts, the loaders its smoke tests executed.
            publishes_loaders: "true"
          - os: blacksmith-4vcpu-ubuntu-2404
            target: aarch64-unknown-linux-gnu
            cross_args: --use-napi-cross
            arm_cflags: -D__ARM_ARCH=8
            node_arch: x64
            glibc_floor: "2.17"
            # The runner is x64 and the artifact is arm64, so this lane cannot
            # execute the addon; it validates the packed layout instead.
            # `--use-napi-cross` unpacks its gcc toolchain with `@napi-rs/lzma`,
            # whose native binding needs Node 22; pnpm silently skips an
            # optional dependency whose engine the running Node does not
            # satisfy, so on Node 20 the toolchain setup dies with "Cannot
            # find native binding".
            node_version: "22"
            run_addon: "false"
          - os: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            node_arch: x64
            run_addon: "true"
            timeout_minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs before actions/setup-node deliberately. pnpm/action-setup picks its
      # bootstrap flavour from whichever `node` is on PATH: below Node 22.13 it
      # forces the @pnpm/exe standalone bootstrap, whose 11.x release ships no
      # Intel-macOS binary (pnpm/pnpm#11423, nodejs/node#62893). Ahead of
      # setup-node the action sees the runner image's Node 22.x and installs
      # the plain, architecture-independent pnpm package instead.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version || '20' }}
          architecture: ${{ matrix.node_arch }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Install workspace dependencies
        run: pnpm install

      - name: Build the addon
        shell: bash
        env:
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.arm_cflags || '' }}
        run: >-
          pnpm --filter @curatelabs/graphforge exec napi build --platform --release
          --target ${{ matrix.target }} ${{ matrix.cross_args }}

      - name: Require the declared glibc floor
        if: matrix.glibc_floor != ''
        shell: bash
        env:
          GLIBC_FLOOR: ${{ matrix.glibc_floor }}
        run: |
          set -euo pipefail
          addons=(crates/graphforge-bindings-node/*.node)
          test "${#addons[@]}" -eq 1
          # readelf reads the dynamic symbol table of any ELF architecture, so
          # the cross-built aarch64 addon is checked on the x64 host too.
          required=$(readelf --dyn-syms --wide "${addons[0]}" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sed 's/^GLIBC_//' | sort -V | tail -n 1)
          test -n "$required"
          highest=$(printf '%s\n%s\n' "$required" "$GLIBC_FLOOR" | sort -V | tail -n 1)
          if [[ "$highest" != "$GLIBC_FLOOR" ]]; then
            printf '%s needs glibc %s, above the declared floor %s\n' \
              "${addons[0]}" "$required" "$GLIBC_FLOOR" >&2
            exit 1
          fi

      - name: Switch to the Node engines floor
        if: matrix.runtime_node_version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.runtime_node_version }}
          architecture: ${{ matrix.node_arch }}

      - name: Load and run the addon
        if: matrix.run_addon == 'true'
        shell: bash
        run: |
          node -e 'import("./crates/graphforge-bindings-node/index.js").then(m => {
            if (typeof m.version() !== "string") process.exit(1)
          })'
          pnpm --filter @curatelabs/graphforge test:smoke
          pnpm --filter @curatelabs/graphforge exec node --test \
            tests/non-cypher-release-parity.test.mjs \
            tests/async-errors.test.mjs

      - name: Validate the cross-built package layout
        if: matrix.run_addon != 'true'
        shell: bash
        working-directory: crates/graphforge-bindings-node
        env:
          NODE_TARGET: ${{ matrix.target }}
        run: |
          addons=(*.node)
          test "${#addons[@]}" -eq 1
          mkdir -p artifacts
          cp "${addons[0]}" artifacts/
          pnpm exec napi create-npm-dirs
          # `napi artifacts` refuses to run unless an addon exists for every
          # target in the manifest, so point it at a config declaring only the
          # one this lane built. The npm packages job runs it against the full
          # manifest once all five addons are collected.
          printf '{"targets":["%s"]}\n' "$NODE_TARGET" > "$RUNNER_TEMP/napi-lane-target.json"
          pnpm exec napi artifacts --output-dir artifacts --npm-dir npm \
            --config-path "$RUNNER_TEMP/napi-lane-target.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/validate-napi-artifacts.py" \
            --npm-dir npm --manifest package.json --target "$NODE_TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: addon-${{ matrix.target }}
          path: crates/graphforge-bindings-node/*.node
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.publishes_loaders == 'true'
        with:
          name: node-loaders
          path: |
            crates/graphforge-bindings-node/index.js
            crates/graphforge-bindings-node/index.d.ts
          if-no-files-found: error
          retention-days: 7

  npm-packages:
    name: npm packages
    needs: [version, addons]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NPM_PACKAGE_VERSION: ${{ needs.version.outputs.npm_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: addon-*
          path: crates/graphforge-bindings-node/artifacts
          merge-multiple: true
      # index.js / index.d.ts are gitignored napi outputs. Pack the ones the
      # Linux x64 lane generated and ran its smoke tests against.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-loaders
          path: crates/graphforge-bindings-node
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Assemble and pack every npm package
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist-npm"
          mkdir -p "$out"
          cd crates/graphforge-bindings-node
          test -f index.js
          test -f index.d.ts
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts --npm-dir npm
          python3 "$GITHUB_WORKSPACE/scripts/ci/validate-napi-artifacts.py" \
            --npm-dir npm --manifest package.json
          pnpm exec napi pre-publish -t npm --skip-optional-publish --no-gh-release
          python3 "$GITHUB_WORKSPACE/scripts/ci/prepare-napi-packages.py" \
            --npm-dir npm --legal-dir .
          for package_dir in npm/*; do
            npm pack "./$package_dir" --ignore-scripts --pack-destination "$out"
          done
          npm pack . --ignore-scripts --pack-destination "$out"
          pnpm --dir "$GITHUB_WORKSPACE/packages/cli" pack --pack-destination "$out"
          pnpm --dir "$GITHUB_WORKSPACE/packages/agent-skills" pack --pack-destination "$out"
          # Five native packages, the main package, the CLI, and agent-skills.
          python3 "$GITHUB_WORKSPACE/scripts/publish_npm.py" --list "$out"
          test "$(find "$out" -name '*.tgz' | wc -l)" -eq 8
          # The main tarball must carry the loaders (named exactly, so a
          # prerelease version such as 0.6.0-rc.1 resolves).
          # Naming the members makes tar fail if either is absent.
          tar -tzf "$out/curatelabs-graphforge-$NPM_PACKAGE_VERSION.tgz" \
            package/index.js package/index.d.ts > /dev/null

      - name: Install the packed packages in a clean project and run them
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist-npm"
          mkdir -p "$RUNNER_TEMP/packed-smoke"
          cd "$RUNNER_TEMP/packed-smoke"
          npm init --yes
          npm install \
            "$out/curatelabs-graphforge-$NPM_PACKAGE_VERSION.tgz" \
            "$out/curatelabs-graphforge-cli-$NPM_PACKAGE_VERSION.tgz" \
            "$out/curatelabs-graphforge-linux-x64-gnu-$NPM_PACKAGE_VERSION.tgz"
          node "$GITHUB_WORKSPACE/scripts/ci/multi-ontology-packaged-smoke.mjs"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist-npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  crates:
    name: Package crates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
      # The package-license check packs the npm packages with pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The same order and flags the publish job uses, without the upload.
      - name: Package every crate in publish order
        run: python3 scripts/publish_crates.py --dry-run
      - name: Require LICENSE and NOTICE inside every publishable package
        run: |
          pnpm install --frozen-lockfile
          python3 scripts/verify_package_licenses.py

  publish:
    name: Publish to crates.io, PyPI, and npm
    if: github.event_name == 'push'
    needs: [version, wheels, sdist, npm-packages, crates]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 240
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # npm trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist-python
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist-npm

      # Each step skips what the registry already has, so a failed run is
      # re-run as-is. crates.io goes first: it is the slowest (new crates are
      # rate-limited to one per ten minutes) and the bindings do not depend on
      # it.
      - name: Publish crates in dependency order
        env:
          CRATES_IO_TRUSTED_PUBLISHING: "true"
          # Trusted Publishing cannot create a crate; a never-published name
          # is uploaded with this token instead.
          CARGO_REGISTRY_TOKEN_NEW_CRATES: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_crates.py

      # Skip by file name: after the build artifacts expire, a full re-run
      # rebuilds wheels whose bytes differ from the ones PyPI already holds.
      - name: Publish wheels and sdist to PyPI
        run: |
          set -euo pipefail
          published="$(curl -fsS https://pypi.org/pypi/graphforge/json \
            | python3 -c 'import json, sys; print("\n".join(f["filename"] for files in json.load(sys.stdin)["releases"].values() for f in files))')"
          missing=()
          for file in dist-python/*; do
            if grep -qxF "$(basename "$file")" <<<"$published"; then
              echo "$(basename "$file"): already published, skipping"
            else
              missing+=("$file")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            uv publish "${missing[@]}"
          fi

      - name: Publish npm packages
        env:
          NPM_DIST_TAG: ${{ needs.version.outputs.npm_dist_tag }}
        run: python3 scripts/publish_npm.py --dist-tag "$NPM_DIST_TAG" dist-npm

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            prerelease=()
            case "$RELEASE_VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"
          fi

  # What a user installs: the published packages from the public registries,
  # in a clean environment. Registries can take a few minutes to serve a new
  # version, hence the bounded wait.
  verify-published:
    name: Install from the registries and run
    needs: [version, publish]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Wait for PyPI and npm to serve the version
        run: |
          python_version="$(uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$RELEASE_VERSION")"
          echo "PYTHON_VERSION=$python_version" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/graphforge/$python_version/json" >/dev/null &&
              npm view "@curatelabs/graphforge@$RELEASE_VERSION" version >/dev/null 2>&1 &&
              npm view "@curatelabs/graphforge-linux-x64-gnu@$RELEASE_VERSION" version >/dev/null 2>&1 &&
              npm view "@curatelabs/graphforge-cli@$RELEASE_VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "attempt $attempt: not served yet"
            sleep 30
          done
          echo "registries did not serve $RELEASE_VERSION within 15 minutes" >&2
          exit 1
      - name: Run the PyPI wheel
        run: >-
          uv run --isolated --no-project --refresh --with "graphforge==$PYTHON_VERSION"
          python crates/graphforge-bindings-py/tests/smoke.py
      - name: Run the npm packages
        run: |
          mkdir -p "$RUNNER_TEMP/published-smoke"
          cd "$RUNNER_TEMP/published-smoke"
          npm init --yes
          npm install "@curatelabs/graphforge@$RELEASE_VERSION" "@curatelabs/graphforge-cli@$RELEASE_VERSION"
          node "$GITHUB_WORKSPACE/scripts/ci/multi-ontology-packaged-smoke.mjs"
