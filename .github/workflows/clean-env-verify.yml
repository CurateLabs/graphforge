name: Clean Environment Verify

# Post-publication only. Proves #167 lanes against public registries.
# Do not treat missing packages as success.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version to verify (for example 0.5.0)
        required: true
        type: string
        default: "0.5.0"
      lanes:
        description: Comma-separated lanes, or 'all'
        required: true
        type: string
        default: "all"
      release_record_path:
        description: Optional repo-relative path to graphforge-release-record-v1 JSON
        required: false
        type: string
        default: ""
permissions:
  contents: read

concurrency:
  group: clean-env-verify-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean-env lanes (${{ inputs.version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"

      - name: Preflight public registries
        id: preflight
        run: |
          set -euo pipefail
          python3 scripts/ci/clean-env-verify.py preflight \
            --version "${{ inputs.version }}" \
            --output clean-env-preflight.json

      - name: Run clean-environment lanes
        env:
          VERSION: ${{ inputs.version }}
          LANES: ${{ inputs.lanes }}
          RECORD: ${{ inputs.release_record_path }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --output clean-env-evidence.json --work "$RUNNER_TEMP/gf-clean-env")
          if [[ -n "$RECORD" ]]; then
            args+=(--release-record "$RECORD")
          fi
          if [[ "$LANES" == "all" ]]; then
            if [[ -z "$RECORD" ]]; then
              args+=(--default)
            else
              args+=(--all)
            fi
          else
            IFS=',' read -r -a selected <<< "$LANES"
            for lane in "${selected[@]}"; do
              lane="${lane#"${lane%%[![:space:]]*}"}"
              lane="${lane%"${lane##*[![:space:]]}"}"
              [[ -n "$lane" ]] || continue
              args+=(--lane "$lane")
            done
          fi
          python3 scripts/ci/clean-env-verify.py run "${args[@]}"
