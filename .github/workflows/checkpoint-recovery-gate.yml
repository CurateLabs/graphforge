name: Checkpoint Recovery Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.sha }}

jobs:
  rust:
    name: Rust and CLI checkpoint evidence
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - name: Validate frozen acceptance ledger
        run: python3 scripts/ci/checkpoint-recovery-gate.py
      - name: Execute Rust and CLI matrix
        run: |
          cargo test -p graphforge-storage --lib project_checkpoints::tests --no-fail-fast
          cargo test -p graphforge-api --lib checkpoints::tests --no-fail-fast
          cargo test -p graphforge-cli --no-fail-fast
          cargo build -p graphforge-cli
      - name: Record Rust and CLI artifacts
        run: |
          mkdir -p checkpoint-fragments
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          root = Path.cwd()
          tests = sorted((root / "target/debug/deps").glob("graphforge_storage-*"))
          tests.extend(sorted((root / "target/debug/deps").glob("graphforge_api-*")))
          test_sha = hashlib.sha256(
              "".join(digest(path) for path in tests if path.is_file()).encode()
          ).hexdigest()
          record = {
              "rust-test-sha": test_sha,
              "cli-binary-sha": digest(root / "target/debug/gf"),
          }
          Path("checkpoint-fragments/rust.json").write_text(
              json.dumps(record, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Save Rust evidence for aggregate job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-fragments/
          key: checkpoint-transfer-${{ github.run_id }}-rust

  python:
    name: Python checkpoint evidence
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and prove isolated same-SHA wheel
        run: |
          uv run --with maturin maturin build --manifest-path crates/graphforge-bindings-py/Cargo.toml --out dist
          uv venv /tmp/gf-checkpoint --python 3.13
          uv pip install --python /tmp/gf-checkpoint/bin/python dist/*.whl
          /tmp/gf-checkpoint/bin/python crates/graphforge-bindings-py/tests/checkpoints.py
      - name: Record Python artifact
        run: |
          mkdir -p checkpoint-fragments
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          record = {"python-wheel-sha": hashlib.sha256(wheel.read_bytes()).hexdigest()}
          Path("checkpoint-fragments/python.json").write_text(
              json.dumps(record, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Save Python evidence for aggregate job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-fragments/
          key: checkpoint-transfer-${{ github.run_id }}-python

  node:
    name: Node checkpoint evidence
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Build and prove same-SHA Node package
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @curatelabs/graphforge exec napi build --platform
          pnpm --filter @curatelabs/graphforge exec node --test tests/checkpoints.test.mjs
          pnpm --filter @curatelabs/graphforge pack --pack-destination "${{ github.workspace }}/dist"
      - name: Record Node artifact
        run: |
          mkdir -p checkpoint-fragments
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = next(Path("dist").glob("*.tgz"))
          record = {"node-package-sha": hashlib.sha256(package.read_bytes()).hexdigest()}
          Path("checkpoint-fragments/node.json").write_text(
              json.dumps(record, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Save Node evidence for aggregate job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-fragments/
          key: checkpoint-transfer-${{ github.run_id }}-node

  checkpoint-evidence:
    name: SHA-bound checkpoint evidence
    if: always()
    needs: [rust, python, node]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-fragments
          key: checkpoint-transfer-${{ github.run_id }}-rust
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-fragments
          key: checkpoint-transfer-${{ github.run_id }}-python
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint-fragments
          key: checkpoint-transfer-${{ github.run_id }}-node
          fail-on-cache-miss: true
      - name: Produce exact SHA-bound report
        run: |
          mkdir -p checkpoint-evidence
          cp tests/contracts/checkpoint-recovery-matrix.json checkpoint-evidence/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          artifacts = {}
          for fragment in sorted((root / "checkpoint-fragments").glob("*.json")):
              artifacts.update(json.loads(fragment.read_text(encoding="utf-8")))
          matrix = root / "tests/contracts/checkpoint-recovery-matrix.json"
          artifacts["checkpoint-recovery-report"] = hashlib.sha256(
              matrix.read_bytes()
          ).hexdigest()
          required = {
              "rust-test-sha",
              "python-wheel-sha",
              "node-package-sha",
              "cli-binary-sha",
              "checkpoint-recovery-report",
          }
          if set(artifacts) != required:
              raise SystemExit(f"incomplete checkpoint evidence: {sorted(artifacts)}")
          report = {
              "schema": "graphforge-checkpoint-evidence/1",
              "source_sha": os.environ["EVIDENCE_SHA"],
              "status": "passed",
              "artifacts": artifacts,
          }
          Path("checkpoint-evidence/report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
