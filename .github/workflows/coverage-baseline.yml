name: Coverage

# Rust coverage enforcement. PR CI does not otherwise run llvm-cov, so the 90%
# patch floor had no enforcement point on the merge path and did not hold.
#
# Nightly, never per merge. Repository policy keeps full llvm-cov out of
# pull-request CI, where its cost would be paid on every review cycle. It ran
# once per push to main until 2026-10-02, when a 19-merge day cost 19 runs of a
# 16 vCPU runner for one ledger (#1760); the floors do not need per-commit
# resolution, so one run a night covers the day's merges as a single patch.
#
# Runs are never cancelled. An earlier draft cancelled in-progress runs, which
# on a day with 21 merges meant no run ever completed.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rust-coverage-ledger:
    name: Rust Coverage Ledger
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The patch is everything that landed since the previous nightly: the
      # last main commit at least 24 hours old. A day with no merges still runs
      # (HEAD is its own base, an empty patch) so the total floors are judged.
      - name: Resolve patch base
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-list -1 --first-parent --before='24 hours ago' HEAD)"
          test -n "$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Patch coverage base: $base"

      # Every run otherwise recompiles the whole workspace under instrumentation.
      # `cargo llvm-cov clean --workspace` drops workspace-member artifacts only,
      # so third-party dependencies stay warm on this volume between runs.
      - name: Mount coverage build disk
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-coverage-rust-1.96.0-${{ hashFiles('Cargo.lock') }}-target-v1
          path: target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-08-05
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --locked --all-extras

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install

      - name: Measure coverage and enforce floors
        shell: bash
        env:
          COVERAGE_RUST_PATCH_BASE: ${{ steps.scope.outputs.base }}
          COVERAGE_FAIL_UNDER_RUST: "80"
          COVERAGE_FAIL_UNDER_RUST_CRATE: "80"
          COVERAGE_FAIL_UNDER_RUST_PATCH: "90"
          COVERAGE_FAIL_UNDER_RUST_PYTHON_ADAPTER: "80"
          COVERAGE_FAIL_UNDER_RUST_NODE_ADAPTER: "80"
        run: make coverage-rust

      - name: Summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s build/coverage-rust/summary.txt ]]; then
            {
              echo '### Rust coverage'
              echo '```'
              cat build/coverage-rust/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
