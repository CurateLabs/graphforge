# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Cargo bumps that change the lockfile also need a Bazel crate-universe repin
# (CARGO_BAZEL_REPIN=1 / MODULE.bazel.lock + feature fingerprint). Reviewers
# should reject Cargo-only Dependabot PRs that skip the Bazel refresh.

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "DecisionNerd"
    assignees:
      - "DecisionNerd"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group minor and patch updates
    groups:
      production-dependencies:
        patterns:
          - "pydantic*"
          - "lark*"
          - "msgpack*"
          - "pyyaml*"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "hypothesis*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "DecisionNerd"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Rust / Cargo workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "DecisionNerd"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
      # Reminder: Cargo bumps need Bazel crate-universe repin before merge.
    # Arrow / Parquet / DataFusion majors must move together. Isolated majors
    # (closed #686 parquet, #695 arrow) leave dual arrow-schema vs DataFusion.
    # Ignore the whole stack's majors until a coordinated upgrade; do not use a
    # Dependabot group here — partial group membership still opens broken PRs.
    ignore:
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-data"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-schema"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-array"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datafusion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datafusion-*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Root npm / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "DecisionNerd"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
