[workspace]
members = [
    "runners/certify",
    "runners/gdc-graphalytics",
    "runners/gdc-snb-interactive",
    "runners/gdc-snb-bi",
    "runners/graph500-generator",
    "runners/smoke",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "=58.3.0"
parquet = { version = "=58.3.0", features = ["arrow"] }
