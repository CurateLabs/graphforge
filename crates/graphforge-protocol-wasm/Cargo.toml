[package]
name = "graphforge-protocol-wasm"
description = "WebAssembly adapter over the Rust-owned Hub discovery and publish validators"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

[lib]
# `cdylib` is the WebAssembly module; `rlib` lets the native contract test call
# the same engine functions the module exports.
crate-type = ["cdylib", "rlib"]

[dependencies]
graphforge-discovery = { version = "0.6.0-rc.7", path = "../graphforge-discovery", features = ["typescript"] }
graphforge-hub-publish = { version = "0.6.0-rc.7", path = "../graphforge-hub-publish", features = ["typescript"] }
serde = { workspace = true }
serde_json = { workspace = true }
tsify = "0.5"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[lints]
workspace = true
