[package]
name = "graphforge-storage"
description = "GraphForge project generations, Arrow schemas, and Parquet storage"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
# `benches/ingest_gate.rs` is a shared module (the two-sided ingest gate's
# judgment, #1476) included by the `m6_storage_io` bench and by
# `tests/ingest_gate_verdict.rs`, not a bench binary, so bench autodiscovery
# is off; the two benches are declared explicitly below.
autobenches = false

[features]
default = []
# Enables the existing cookie-protected subprocess failpoints for higher-level
# workspace tests. Production consumers do not enable this feature.
test-failpoints = []
# Exposes compact-root builders only to higher-level cross-crate tests.
test-support = []

[dependencies]
graphforge-value = { version = "0.5.2", path = "../graphforge-value" }
graphforge-core = { version = "0.5.2", path = "../graphforge-core" }
graphforge-filesystem = { version = "0.5.2", path = "../graphforge-filesystem" }
graphforge-ir = { version = "0.5.2", path = "../graphforge-ir" }
graphforge-ontology = { version = "0.5.2", path = "../graphforge-ontology" }
arrow = { workspace = true }
async-trait = "0.1"
atomicwrites = "0.4.4"
datafusion = { workspace = true }
datafusion-catalog = "54"
fs4 = "1.1"
futures = { workspace = true }
parquet = { workspace = true }
thrift = { workspace = true }
bytes = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
zstd = { version = "=0.14.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
named-lock = "0.4.1"

[dev-dependencies]
divan = { workspace = true }
wait-timeout = "0.2"

# Operator-run #1506 sort/partition kernel measurements; see
# docs/development/evidence/shape-sort-partition-spike-1506.md.
[[example]]
name = "sort_partition_spike"
required-features = ["test-support"]

[[bench]]
name = "m6_storage"
harness = false

[[bench]]
name = "m6_storage_io"
harness = false

[lints]
workspace = true
