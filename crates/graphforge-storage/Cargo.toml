[package]
name = "graphforge-storage"
description = "GraphForge StorageProvider trait and Parquet backend"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = []
# Enables the existing cookie-protected subprocess failpoints for higher-level
# workspace tests. Production consumers do not enable this feature.
test-failpoints = []

[dependencies]
graphforge-core = { version = "0.5.2", path = "../graphforge-core" }
graphforge-filesystem = { version = "0.5.2", path = "../graphforge-filesystem" }
graphforge-ir = { version = "0.5.2", path = "../graphforge-ir" }
graphforge-ontology = { version = "0.5.2", path = "../graphforge-ontology" }
arrow = { workspace = true }
async-trait = "0.1"
atomicwrites = "0.4.4"
datafusion = { workspace = true }
datafusion-catalog = "54"
fs4 = "1.1"
futures = { workspace = true }
parquet = { workspace = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
unicode-normalization = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
named-lock = "0.4.1"

[dev-dependencies]
divan = { workspace = true }
wait-timeout = "0.2"

[[bench]]
name = "m6_storage"
harness = false

[[bench]]
name = "m6_storage_io"
harness = false

[lints]
workspace = true
