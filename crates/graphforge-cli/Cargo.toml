[package]
name = "graphforge-cli"
description = "GraphForge command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "gf"
path = "src/main.rs"

[features]
# #1688 experiment: GF_READ_PATH_CANDIDATE selects the #1619 read-path
# candidate. Never a default.
read-path-experiment = ["graphforge-api/read-path-experiment"]

[dependencies]
arrow = { workspace = true }
graphforge-api = { version = "0.5.2", path = "../graphforge-api", default-features = false, features = ["knowledge", "search", "provenance", "portable", "discovery", "research"] }
graphforge-discovery = { version = "0.5.2", path = "../graphforge-discovery" }
clap = { workspace = true }
fs4 = "1.1"
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
libc = "0.2"
ureq = { workspace = true }
url = { workspace = true }

[dev-dependencies]
graphforge-storage = { version = "0.5.2", path = "../graphforge-storage" }
parquet = { workspace = true }

[lints]
workspace = true
