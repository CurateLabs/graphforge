[package]
name = "graphforge-rel"
description = "GraphForge Graph IR → DataFusion relational lowering"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# Explicit opt-in for the independent fixed-hop differential oracle.
differential-testing = []
# #1688 experiment: read-path candidates B (relational fixed hops) and C
# (lowerer-chosen fast paths) for the #1619 comparison. Never a default.
read-path-experiment = ["differential-testing", "graphforge-plan/read-path-experiment"]

[dependencies]
graphforge-value = { version = "0.5.2", path = "../graphforge-value" }
graphforge-core = { version = "0.5.2", path = "../graphforge-core" }
graphforge-ir = { version = "0.5.2", path = "../graphforge-ir" }
graphforge-ontology = { version = "0.5.2", path = "../graphforge-ontology" }
graphforge-plan = { version = "0.5.2", path = "../graphforge-plan" }
datafusion = { workspace = true }
arrow-data = { workspace = true }
datafusion-functions-aggregate = "54"
chrono = "0.4"
chrono-tz = "0.10"
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
graphforge-storage = { version = "0.5.2", path = "../graphforge-storage" }
tempfile = "3"
insta = { workspace = true }
graphforge-cypher = { path = "../graphforge-cypher" }

[lints]
workspace = true
