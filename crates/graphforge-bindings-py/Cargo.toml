[package]
name = "graphforge-bindings-py"
description = "GraphForge Python bindings (PyO3 + maturin)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
graphforge-api = { version = "0.5.2", path = "../graphforge-api" }
graphforge-cli = { version = "0.5.2", path = "../graphforge-cli" }
# `StreamExt::next` drives the facade's async streaming query one batch per pull
# in the synchronous RecordBatchReader adapter (execute_stream, #587).
futures = { workspace = true }
# `pyarrow` enables arrow's C Data Interface bridge (arrow-pyarrow, pinned to the
# same pyo3 0.28) for zero-copy RecordBatch → pyarrow.Table transfer.
arrow = { workspace = true, features = ["pyarrow"] }
# algorithm publication recipes are versioned JSON values owned by the Rust facade.
serde_json.workspace = true
uuid = { workspace = true }
# `extension-module` is enabled HERE only (a Python extension must not link
# libpython); keeping it off the workspace dep avoids breaking other crates.
# `abi3-py310` builds a single stable-ABI wheel that installs on CPython 3.10+,
# so one wheel per OS covers the whole py3.10–3.14 CI matrix.
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }

[lints]
workspace = true
