[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "graphforge"
description = "GraphForge native graph engine, bindings, and repository lifecycle CLI"
version = "0.5.2"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["graph", "openCypher", "Arrow", "embedded", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Database :: Database Engines/Servers",
]
# `execute()` returns a pyarrow.Table via the Arrow C Data Interface.
dependencies = ["pyarrow>=14"]

[project.scripts]
graphforge = "graphforge.cli:main"

[project.urls]
Homepage = "https://docs.graphforge.sh/"
Documentation = "https://docs.graphforge.sh/"
Repository = "https://github.com/CurateLabs/graphforge"
Issues = "https://github.com/CurateLabs/graphforge/issues"

# `execute_polars()` is a thin convenience wrapper; Polars is optional.
[project.optional-dependencies]
polars = ["polars>=0.20"]

[tool.maturin]
# The native extension is nested under the `graphforge` package.
module-name = "graphforge._graphforge_rs"
# Mixed layout: the pure-Python `graphforge/` package (which re-exports the
# native module and carries thin helpers like `recipes`) lives under `python/`.
python-source = "python"
# Use the release profile for maturin builds
profile = "release"
# Only build the Python extension module, not the whole workspace.
# abi3-py310 → one stable-ABI wheel per OS covers the whole py3.10–3.14 matrix.
features = ["extension-module"]
include = ["python/graphforge/_project_skills/**/*"]
