[package]
name = "graphforge-discovery"
description = "Rust-owned GraphForge Hub repository discovery contract"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

png = "=0.18.1"
roxmltree = "=0.21.1"
quick-xml = "=0.42.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CSPRNG for permanent item IDs; wasm builds parse and validate only.
getrandom = { version = "0.3", optional = true }

[features]
default = ["generate"]
# Create permanent item IDs from the operating system's CSPRNG (non-wasm targets).
generate = ["dep:getrandom"]

[lints]
workspace = true
