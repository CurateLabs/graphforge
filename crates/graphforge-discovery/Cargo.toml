[package]
name = "graphforge-discovery"
description = "Rust-owned GraphForge Hub repository discovery contract"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

png = "=0.18.1"
roxmltree = "=0.21.1"
quick-xml = "=0.42.0"

# Emits TypeScript declarations from the wire types for the WebAssembly package.
tsify = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
typescript = ["dep:tsify", "dep:wasm-bindgen"]

[lints]
workspace = true
