[package]
name = "graphforge-api"
description = "GraphForge public Rust API — the GraphForge engine facade"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# Preserve the existing facade for default consumers. Lean engine users can
# select only the surfaces they need with `--no-default-features`.
default = ["knowledge", "search", "provenance", "portable", "discovery", "research"]
knowledge = ["dep:graphforge-knowledge", "provenance"]
search = ["dep:graphforge-search"]
provenance = ["dep:graphforge-provenance"]
portable = ["dep:graphforge-portable-oci"]
discovery = ["dep:graphforge-discovery"]
research = ["knowledge", "portable"]

[dependencies]
graphforge-discovery = { version = "0.6.0-dev", path = "../graphforge-discovery", optional = true }
graphforge-portable-oci = { version = "0.6.0-dev", path = "../graphforge-portable-oci", optional = true }
graphforge-value = { version = "0.6.0-dev", path = "../graphforge-value" }
graphforge-core = { version = "0.6.0-dev", path = "../graphforge-core" }
graphforge-ir = { version = "0.6.0-dev", path = "../graphforge-ir" }
graphforge-ontology = { version = "0.6.0-dev", path = "../graphforge-ontology" }
graphforge-provenance = { version = "0.6.0-dev", path = "../graphforge-provenance", optional = true }
graphforge-knowledge = { version = "0.6.0-dev", path = "../graphforge-knowledge", optional = true }
graphforge-cypher = { version = "0.6.0-dev", path = "../graphforge-cypher" }
graphforge-rel = { version = "0.6.0-dev", path = "../graphforge-rel" }
graphforge-storage = { version = "0.6.0-dev", path = "../graphforge-storage" }
graphforge-exec = { version = "0.6.0-dev", path = "../graphforge-exec" }
graphforge-io = { version = "0.6.0-dev", path = "../graphforge-io" }
graphforge-observability = { version = "0.6.0-dev", path = "../graphforge-observability" }
graphforge-search = { version = "0.6.0-dev", path = "../graphforge-search", optional = true }
graphforge-filesystem = { version = "0.6.0-dev", path = "../graphforge-filesystem" }
arrow = { workspace = true }
bytes = "1"
datafusion = { workspace = true }
futures = { workspace = true }
# The bounded LZ4 frame verification of IPC sources (issue #1918), locked to
# the version arrow-ipc already builds against.
lz4_flex = { version = "0.13.1", default-features = false, features = ["std", "frame"] }
parquet = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
fs4 = "1.1"
uuid = { workspace = true }

[dev-dependencies]
# Assessment-only IPC codec experiments; production writers remain unchanged.
arrow = { workspace = true, features = ["ipc_compression"] }
cucumber = { workspace = true }
divan = { workspace = true }
tokio = { workspace = true }
graphforge-cypher = { path = "../graphforge-cypher" }
graphforge-storage = { path = "../graphforge-storage", features = ["test-failpoints", "test-support"] }
graphforge-knowledge = { path = "../graphforge-knowledge", features = ["test-support"] }

[[bin]]
name = "graphforge-fly-filesystem-smoke"
path = "src/bin/graphforge-fly-filesystem-smoke.rs"
required-features = ["portable"]

