[package]
name = "graphforge-api"
description = "GraphForge public Rust API — the GraphForge engine facade"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
graphforge-core = { version = "0.5.2", path = "../graphforge-core" }
graphforge-ir = { version = "0.5.2", path = "../graphforge-ir" }
graphforge-ontology = { version = "0.5.2", path = "../graphforge-ontology" }
graphforge-provenance = { version = "0.5.2", path = "../graphforge-provenance" }
graphforge-knowledge = { version = "0.5.2", path = "../graphforge-knowledge" }
graphforge-cypher = { version = "0.5.2", path = "../graphforge-cypher" }
graphforge-rel = { version = "0.5.2", path = "../graphforge-rel" }
graphforge-storage = { version = "0.5.2", path = "../graphforge-storage" }
graphforge-exec = { version = "0.5.2", path = "../graphforge-exec" }
graphforge-io = { version = "0.5.2", path = "../graphforge-io" }
graphforge-observability = { version = "0.5.2", path = "../graphforge-observability" }
graphforge-search = { version = "0.5.2", path = "../graphforge-search" }
graphforge-filesystem = { version = "0.5.2", path = "../graphforge-filesystem" }
arrow = { workspace = true }
bytes = "1"
datafusion = { workspace = true }
futures = { workspace = true }
parquet = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
fs4 = "1.1"
uuid = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
tokio = { workspace = true }
graphforge-cypher = { path = "../graphforge-cypher" }
graphforge-storage = { path = "../graphforge-storage", features = ["test-failpoints", "test-support"] }

# BDD runner for the public-API + TCK feature files (tests/features/).
# A custom-harness target (cucumber drives its own main).
[[test]]
name = "bdd"
harness = false

[lints]
workspace = true
