[package]
name = "graphforge-hub-publish"
description = "Rust-owned GraphForge Hub publish wire contract and reference Hub"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
graphforge-discovery = { version = "0.6.0-rc.7", path = "../graphforge-discovery" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["serde"] }
# Emits TypeScript declarations from the wire types for the WebAssembly package.
tsify = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
uuid = { workspace = true }

[features]
typescript = ["dep:tsify", "dep:wasm-bindgen", "graphforge-discovery/typescript"]

[lints]
workspace = true
