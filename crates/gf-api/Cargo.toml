[package]
name = "gf-api"
description = "GraphForge public Rust API — the GraphForge engine facade"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
gf-core = { path = "../gf-core" }
gf-ir = { path = "../gf-ir" }
gf-ontology = { path = "../gf-ontology" }
gf-provenance = { path = "../gf-provenance" }
gf-knowledge = { path = "../gf-knowledge" }
gf-cypher = { path = "../gf-cypher" }
gf-rel = { path = "../gf-rel" }
gf-storage = { path = "../gf-storage" }
gf-exec = { path = "../gf-exec" }
gf-search = { path = "../gf-search" }
arrow = { workspace = true }
datafusion = { workspace = true }
futures = { workspace = true }
parquet = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
uuid = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
tokio = { workspace = true }
gf-cypher = { path = "../gf-cypher" }
gf-storage = { path = "../gf-storage", features = ["test-failpoints"] }

# BDD runner for the public-API + TCK feature files (tests/features/).
# A custom-harness target (cucumber drives its own main).
[[test]]
name = "bdd"
harness = false

[lints]
workspace = true
